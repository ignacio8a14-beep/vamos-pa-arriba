<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vamos Pa' Arriba</title>
<style>
:root{
  --verde:#1f6f5c; --verde2:#2b8a72; --verde-claro:#e3f2ec; --crema:#faf7f2; --texto:#1e2a27;
  --gris:#6b7774; --borde:#e2e6e4; --ambar:#e6a23c; --rojo:#c8553d; --azul:#3c6e9e; --blanco:#fff;
  --sombra:0 2px 10px rgba(0,0,0,.06); --radio:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--crema);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:.3em 0 .6em}
small,.mut{color:var(--gris)}
#app{max-width:640px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top .ic{background:none;border:none;font-size:1.4rem;padding:6px;cursor:pointer}
.card{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;margin-bottom:12px}
.card.verde{background:var(--verde);color:#fff}
.card.suave{background:var(--verde-claro)}
.fila{display:flex;align-items:center;gap:10px}
.entre{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 16px;background:var(--verde);color:#fff;font-weight:600;cursor:pointer;min-height:46px}
.btn.sec{background:var(--verde-claro);color:var(--verde)}
.btn.borde{background:transparent;border:1.5px solid var(--borde);color:var(--texto)}
.btn.ambar{background:var(--ambar)}
.btn.rojo{background:var(--rojo)}
.btn.chico{padding:6px 12px;min-height:34px;font-size:.9rem;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--borde);background:#fff;cursor:pointer;font-size:.92rem;margin:3px}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
.chip.no{background:#fbe9e5;border-color:var(--rojo);color:var(--rojo);text-decoration:line-through}
label.f{display:block;font-size:.88rem;color:var(--gris);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;padding:11px 12px;border:1.5px solid var(--borde);border-radius:12px;background:#fff;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--verde2)}
textarea.i{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--borde);cursor:pointer;user-select:none}
.check:last-child{border-bottom:none}
.check .caja{width:28px;height:28px;border-radius:9px;border:2px solid var(--borde);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem;color:#fff}
.check.ok .caja{background:var(--verde);border-color:var(--verde)}
.check .caja{color:transparent}.check.ok .caja{color:#fff}
.full-screen .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff}
.full-screen .chip.on{background:#fff;border-color:#fff;color:var(--verde)}
.full-screen .check.ok .caja{background:#fff;border-color:#fff;color:var(--verde)}
.check.ok .txt{color:var(--gris);text-decoration:line-through}
.check .txt{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--gris);padding:4px 8px;cursor:pointer;flex:1}
.nav button span{font-size:1.35rem}
.nav button.on{color:var(--verde);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{white-space:nowrap;margin:0}
.lista-item{padding:12px 0;border-bottom:1px solid var(--borde)}
.lista-item:last-child{border-bottom:none}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--verde-claro);color:var(--verde);font-weight:600}
.badge.alto{background:#fbe9e5;color:var(--rojo)}
.badge.medio{background:#fdf1dc;color:#a8701a}
.big{font-size:2.2rem;font-weight:800}
.semana{display:flex;justify-content:space-between;margin-top:8px}
.semana div{text-align:center;font-size:.75rem;color:var(--gris)}
.semana .pt{width:30px;height:30px;border-radius:50%;margin:4px auto 0;background:var(--borde);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem}
.semana .pt.p1{background:#b7dccf}.semana .pt.p2{background:#6fb7a0}.semana .pt.p3{background:var(--verde)}
.semana .pt.hoy{outline:2px solid var(--ambar);outline-offset:2px}
.emo{font-size:1.7rem;background:none;border:2px solid transparent;border-radius:12px;padding:4px 6px;cursor:pointer;opacity:.55}
.emo.on{opacity:1;border-color:var(--verde);background:var(--verde-claro)}
.agua{display:flex;gap:4px;flex-wrap:wrap}
.agua button{font-size:1.4rem;background:none;border:none;cursor:pointer;opacity:.25;padding:2px}
.agua button.on{opacity:1}
.comida{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--borde)}
.comida:last-child{border-bottom:none}
.comida .mom{font-size:.75rem;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
.overlay{position:fixed;inset:0;background:rgba(20,30,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--crema);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.full-screen{position:fixed;inset:0;z-index:60;background:var(--verde);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.full-screen.calmo{background:linear-gradient(180deg,#1f6f5c,#2c5d78)}
.full-screen .cerrar{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:999px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.full-screen small{color:#fff}
.full-screen .btn{background:#fff;color:var(--verde)}
.full-screen .btn.sec{background:rgba(255,255,255,.18);color:#fff}
.full-screen textarea.i,.full-screen input.i{color:var(--texto)}
.circulo{width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin:28px auto;transition:transform 4s ease-in-out;font-size:1.2rem;font-weight:600;box-shadow:0 0 0 18px rgba(255,255,255,.06)}
.reloj{font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0}
.paso-txt{font-size:1.15rem;max-width:460px;margin:10px auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:.92rem;box-shadow:var(--sombra)}
table.val{width:100%;border-collapse:collapse;font-size:.9rem}
table.val th,table.val td{padding:7px 4px;border-bottom:1px solid var(--borde);text-align:left}
table.val th{color:var(--gris);font-weight:600;font-size:.8rem}
.login{max-width:420px;margin:8vh auto 0}
.logo{font-size:2.6rem;text-align:center}
.centro{text-align:center}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.oculto{display:none!important}
.landing{max-width:560px;margin:0 auto}
.landing .card.mb0 b{display:block;margin-top:2px}
.legal h3{margin-top:14px}.legal p{font-size:.95rem}
.ia-lleno{background:#fff8dc!important;border-color:var(--ambar)!important}
.nota{font-size:.85rem;color:var(--gris);background:#fff;border-left:3px solid var(--ambar);padding:8px 10px;border-radius:8px;margin:8px 0}
.prog{height:10px;background:var(--borde);border-radius:999px;overflow:hidden}
.prog div{height:100%;background:var(--verde);transition:width .3s}
.card.verde .btn{background:#fff;color:var(--verde)}
.card.verde .prog{background:rgba(255,255,255,.25)}.card.verde .prog div{background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav oculto" id="nav">
  <button data-v="hoy"><span>🏠</span>Hoy</button>
  <button data-v="comida"><span>🥗</span>Comida</button>
  <button data-v="mover"><span>🚶</span>Mover</button>
  <button data-v="calma"><span>🕊️</span>Calma</button>
  <button data-v="salud"><span>📋</span>Salud</button>
</nav>

<script>
/* =========================================================
   Vamos Pa' Arriba — app personal
   ========================================================= */

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const fechaStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyStr = () => fechaStr(new Date());
const parseF = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const sumarDias = (s, n) => { const d = parseF(s); d.setDate(d.getDate() + n); return fechaStr(d); };
const difDias = (a, b) => Math.round((parseF(a) - parseF(b)) / 86400000);
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DIAS_C = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fechaLarga = (s) => { const d = parseF(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fechaCorta = (s) => { const d = parseF(s); return `${d.getDate()}/${d.getMonth() + 1}/${String(d.getFullYear()).slice(2)}`; };
const azar = (arr) => arr[Math.floor(Math.random() * arr.length)];
const mmss = (s) => `${Math.floor(s / 60)}:${pad(Math.max(0, Math.floor(s % 60)))}`;

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function vibrar(ms = 150) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// Campanita suave (Web Audio, sin archivos)
let audioCtx = null;
function campana(frec = 528) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = frec;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 2.6);
  } catch (e) {}
}

// Mantener pantalla encendida durante rutinas
let wakeLock = null;
async function pantallaEncendida(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

// ---------- API ----------
const S = {
  token: localStorage.getItem('vpa_token'),
  usuario: null,
  vista: 'hoy',
  sub: {},            // sub-pestañas por vista
  dias: {},           // cache fecha -> datos
  familia: null, miembros: [],
  config: {},
  cache: {},          // tipo -> registros
};

async function api(metodo, url, cuerpo) {
  const r = await fetch(url, {
    method: metodo,
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && S.token) { salir(); throw new Error('Sesión vencida'); }
  if (!r.ok) throw new Error((data && data.error) || 'Error de conexión');
  return data;
}
const perfil = () => (S.usuario && S.usuario.perfil) || {};
async function guardarPerfil(cambios) {
  S.usuario = await api('PATCH', '/api/perfil', cambios);
}
async function registros(tipo, forzar) {
  if (!forzar && S.cache[tipo]) return S.cache[tipo];
  S.cache[tipo] = await api('GET', '/api/registros?tipo=' + tipo);
  return S.cache[tipo];
}
async function nuevoRegistro(tipo, fecha, datos) {
  const r = await api('POST', '/api/registros', { tipo, fecha, datos });
  delete S.cache[tipo];
  return r;
}
async function editarRegistro(id, tipo, fecha, datos) {
  await api('PUT', '/api/registros/' + id, { fecha, datos });
  delete S.cache[tipo];
}
async function borrarRegistro(id, tipo) {
  await api('DELETE', '/api/registros/' + id);
  delete S.cache[tipo];
}
async function cargarDias(desde, hasta) {
  const filas = await api('GET', `/api/dias?desde=${desde}&hasta=${hasta}`);
  filas.forEach((f) => (S.dias[f.fecha] = f.datos));
}
async function marcarDia(fecha, cambios) {
  const r = await api('PUT', '/api/dias/' + fecha, cambios);
  S.dias[fecha] = r.datos;
  return r.datos;
}
async function marcarHabito(clave, valor = true, fecha = hoyStr()) {
  if (!S.dias[fecha]) await cargarDias(fecha, fecha);
  const d = S.dias[fecha] || {};
  const h = { ...(d.h || {}), [clave]: valor };
  await marcarDia(fecha, { h });
}

/* =========================================================
   DATOS: alimentos, recetas, ejercicios, textos
   ========================================================= */

// cat = góndola para la lista de compras
const ING = {
  avena: ['Avena', 'Almacén'], leche: ['Leche descremada', 'Lácteos'], yogur: ['Yogur natural sin azúcar', 'Lácteos'],
  queso: ['Queso fresco / blanco', 'Lácteos'], huevo: ['Huevos', 'Almacén'], pan_integral: ['Pan integral', 'Panadería'],
  harina_maiz: ['Harina de maíz precocida (arepa)', 'Almacén'], harina_integral: ['Harina integral', 'Almacén'],
  pan_rallado: ['Pan rallado', 'Almacén'], galletas_arroz: ['Galletas de arroz', 'Almacén'],
  arroz_integral: ['Arroz integral', 'Almacén'], fideos_integrales: ['Fideos integrales', 'Almacén'],
  lentejas: ['Lentejas', 'Almacén'], garbanzos: ['Garbanzos', 'Almacén'], porotos: ['Porotos / caraotas negras', 'Almacén'],
  atun: ['Atún al natural (lata)', 'Almacén'], sardinas: ['Sardinas (lata)', 'Almacén'], mani: ['Maní sin sal', 'Almacén'],
  semillas: ['Semillas (lino, chía o girasol)', 'Almacén'], aceite: ['Aceite de oliva o canola', 'Almacén'],
  pollo: ['Pollo (pechuga o pata-muslo sin piel)', 'Carnicería'], carne: ['Carne magra (nalga, peceto, cuadril)', 'Carnicería'],
  cerdo: ['Cerdo magro (solomillo, carré)', 'Carnicería'], pescado: ['Pescado (merluza u otro)', 'Pescadería'],
  banana: ['Banana', 'Verdulería'], manzana: ['Manzana', 'Verdulería'], fruta: ['Fruta de estación', 'Verdulería'],
  papa: ['Papa', 'Verdulería'], batata: ['Batata', 'Verdulería'], zapallo: ['Zapallo / calabaza', 'Verdulería'],
  zanahoria: ['Zanahoria', 'Verdulería'], tomate: ['Tomate', 'Verdulería'], lechuga: ['Lechuga / hojas verdes', 'Verdulería'],
  cebolla: ['Cebolla', 'Verdulería'], morron: ['Morrón', 'Verdulería'], zapallito: ['Zapallito', 'Verdulería'],
  acelga: ['Acelga o espinaca', 'Verdulería'], brocoli: ['Brócoli', 'Verdulería'], berenjena: ['Berenjena', 'Verdulería'],
  repollo: ['Repollo', 'Verdulería'], chauchas: ['Chauchas', 'Verdulería'], pepino: ['Pepino', 'Verdulería'],
};

// Grupos para excluir de un toque
const GRUPOS = {
  'Lácteos': ['leche', 'yogur', 'queso'],
  'Huevo': ['huevo'],
  'Pescado y mariscos': ['pescado', 'atun', 'sardinas'],
  'Cerdo': ['cerdo'],
  'Carne vacuna': ['carne'],
  'Pollo': ['pollo'],
  'Legumbres': ['lentejas', 'garbanzos', 'porotos'],
  'Gluten / trigo': ['pan_integral', 'harina_integral', 'pan_rallado', 'fideos_integrales'],
  'Maní y semillas': ['mani', 'semillas'],
};

// m: d=desayuno, m=merienda, a=almuerzo, c=cena · tag: pescado / legumbre
const RECETAS = [
  // Desayunos y meriendas
  { id: 'avena_banana', n: 'Avena cocida con banana y canela', m: 'dm', ing: ['avena', 'leche', 'banana'], p: 'Cocina 4-5 cucharadas de avena con leche o agua 3-4 minutos. Agrega banana en rodajas y canela. Sin azúcar.' },
  { id: 'yogur_avena', n: 'Yogur natural con avena y fruta', m: 'dm', ing: ['yogur', 'avena', 'fruta'], p: 'Un pote de yogur natural sin azúcar, 2 cucharadas de avena y fruta picada.' },
  { id: 'huevos_tostada', n: 'Huevos revueltos con pan integral y tomate', m: 'd', ing: ['huevo', 'pan_integral', 'tomate'], p: '2 huevos revueltos con muy poco aceite, 1-2 rebanadas de pan integral y tomate en rodajas.' },
  { id: 'tostadas_queso', n: 'Tostadas integrales con queso blanco y tomate', m: 'dm', ing: ['pan_integral', 'queso', 'tomate'], p: '2 tostadas integrales con queso blanco o untable descremado y tomate con orégano.' },
  { id: 'arepa_huevo', n: 'Arepa con huevo y queso blanco', m: 'd', ing: ['harina_maiz', 'huevo', 'queso'], p: 'Una arepa mediana (no dos 😉) asada en budare o sartén sin aceite, rellena con huevo revuelto y un poco de queso blanco.' },
  { id: 'arepa_pollo', n: 'Arepa con pollo desmechado y tomate', m: 'd', ing: ['harina_maiz', 'pollo', 'tomate'], p: 'Una arepa mediana con pollo desmechado que sobró de otra comida, tomate y lechuga.' },
  { id: 'licuado', n: 'Licuado de banana con leche y avena', m: 'dm', ing: ['leche', 'banana', 'avena'], p: 'Licúa 1 banana, 1 vaso de leche descremada y 1 cucharada de avena. Sin azúcar.' },
  { id: 'fruta_mani', n: 'Fruta + un puñado de maní sin sal', m: 'mk', ing: ['fruta', 'mani'], p: 'Una fruta entera y un puñado chico de maní (lo que entra en la palma cerrada).' },
  { id: 'tostada_huevo', n: 'Tostada integral con huevo duro', m: 'mk', ing: ['pan_integral', 'huevo'], p: 'Una tostada integral con un huevo duro en rodajas, sal y pimienta.' },
  { id: 'yogur_semillas', n: 'Yogur con manzana y semillas', m: 'mk', ing: ['yogur', 'manzana', 'semillas'], p: 'Yogur natural, media manzana en cubitos y una cucharadita de semillas.' },
  { id: 'galletas_queso', n: 'Infusión + galletas de arroz con queso', m: 'mk', ing: ['galletas_arroz', 'queso'], p: 'Mate, té o café sin azúcar con 3 galletas de arroz y queso blanco.' },
  { id: 'bastones_hummus', n: 'Bastones de zanahoria y pepino con hummus', m: 'mk', ing: ['zanahoria', 'pepino', 'garbanzos'], p: 'Hummus casero: garbanzos cocidos, limón, ajo, un chorrito de aceite y agua; procesar. Mojar bastones de verdura.' },
  { id: 'fruta_sola', n: 'Una fruta de estación', m: 'k', ing: ['fruta'], p: 'Una fruta entera, con cáscara si se puede. Simple y práctica para media mañana.' },
  { id: 'fruta_yogur', n: 'Fruta con yogur natural', m: 'mk', ing: ['fruta', 'yogur'], p: 'Una fruta de estación picada con yogur natural sin azúcar.' },
  // Almuerzos y cenas

];
const ES_INBODY = (r) => r.datos.tipo === 'Composición corporal (InBody)';
function flechaInbody(def, actual, antes) {
  if (actual == null || antes == null || actual === antes) return actual === antes && actual != null ? '=' : '';
  const sube = actual > antes;
  const color = !def.mejor ? 'var(--gris)' : (def.mejor === 'sube') === sube ? 'var(--verde)' : 'var(--rojo)';
  return `<span style="color:${color};font-weight:700">${sube ? '↑' : '↓'}</span>`;
}

// campos: [{k, l, t: text|number|date|time|textarea|select|check|escala, op:[...], ph}]
function htmlCampos(campos, datos = {}) {
  return campos.map((c) => {
    const h = htmlCampo(c, datos);
    return c.g ? `<div data-grupo="${c.g}">${h}</div>` : h;
  }).join('');
}
function htmlCampo(c, datos) {
  {
    const v = datos[c.k] ?? c.def ?? '';
    const id = 'c_' + c.k;
    if (c.t === 'titulo') return `<h3 class="mt">${c.l}</h3>`;
    if (c.t === 'subtitulo') return `<p class="mt mb0" style="font-weight:700;color:var(--verde);border-bottom:1px solid var(--borde);padding-bottom:4px">${c.l}</p>`;
    if (c.t === 'nota') return `<p class="mut mb0"><small>${c.l}</small></p>`;
    if (c.t === 'textarea') return `<label class="f">${c.l}</label><textarea class="i" id="${id}" placeholder="${esc(c.ph || '')}">${esc(v)}</textarea>`;
    if (c.t === 'select') return `<label class="f">${c.l}</label><select class="i" id="${id}">${c.op.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    if (c.t === 'check') return `<label class="check ${v ? 'ok' : ''}" style="border:none" onclick="this.classList.toggle('ok')" data-k="${c.k}" id="${id}"><span class="caja">✓</span><span>${c.l}</span></label>`;
    if (c.t === 'escala') return `<label class="f">${c.l}</label><div class="fila" id="${id}" data-v="${esc(v)}">${c.op.map((o, i) => `<button type="button" class="emo ${String(v) === String(i + 1) ? 'on' : ''}" data-i="${i + 1}" onclick="this.parentNode.dataset.v=this.dataset.i;[...this.parentNode.children].forEach(b=>b.classList.toggle('on',b===this))">${o}</button>`).join('')}</div>`;
    const step = c.t === 'number' ? 'step="any" inputmode="decimal"' : '';
    return `<label class="f">${c.l}</label><input class="i" id="${id}" type="${c.t || 'text'}" ${step} value="${esc(v)}" placeholder="${esc(c.ph || '')}">`;
  }
}
function leerCampos(campos, raiz) {
  const out = {};
  campos.forEach((c) => {
    if (c.t === 'titulo' || c.t === 'subtitulo' || c.t === 'nota') return;
    const el = $('#c_' + c.k, raiz);
    if (!el) return;
    if (c.t === 'check') out[c.k] = el.classList.contains('ok');
    else if (c.t === 'escala') out[c.k] = el.dataset.v ? Number(el.dataset.v) : null;
    else if (c.t === 'number') out[c.k] = el.value === '' ? null : Number(String(el.value).replace(',', '.'));
    else out[c.k] = el.value.trim();
  });
  return out;
}

/* ---------- Archivos adjuntos (PDF y fotos) ---------- */
const MAX_PDF = 10 * 1024 * 1024;
function leerBase64(file) {
  return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = mal; r.readAsDataURL(file); });
}
async function comprimirImagen(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, mal) => { img.onload = ok; img.onerror = () => mal(new Error('No se pudo leer la foto')); img.src = url; });
    const k = Math.min(1, 1800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
async function subirArchivo(file, destino) {
  let base64, tipo, nombre = file.name || 'archivo';
  if (file.type === 'application/pdf') {
    if (file.size > MAX_PDF) throw new Error(`"${nombre}" pesa más de 10 MB`);
    base64 = await leerBase64(file); tipo = 'application/pdf';
  } else if (file.type.startsWith('image/')) {
    base64 = await comprimirImagen(file); tipo = 'image/jpeg'; nombre = nombre.replace(/\.[^.]+$/, '') + '.jpg';
  } else throw new Error(`"${nombre}": solo se aceptan PDF o fotos`);
  return api('POST', '/api/archivos', { nombre, tipo, base64, ...destino });
}
async function abrirArchivo(id, nombre) {
  const ventana = window.open('', '_blank');
  try {
    const r = await fetch('/api/archivos/' + id, { headers: { Authorization: 'Bearer ' + S.token } });
    if (!r.ok) throw new Error('No se pudo abrir el archivo');
    const url = URL.createObjectURL(await r.blob());
    if (ventana) ventana.location = url;
    else { const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { if (ventana) ventana.close(); toast(e.message); }
}
const pesoTxt = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
function htmlListaArchivos(lista, pendientes = [], conIA = false) {
  const btnIA = (attr) => (conIA ? `<button class="btn chico" ${attr} title="Completar los campos con IA">✨ Leer</button>` : '');
  const fila = (ic, nombre, extra, acciones) => `<div class="fila entre lista-item" style="padding:8px 0"><div style="min-width:0;flex:1"><span>${ic}</span> <span style="word-break:break-all">${esc(nombre)}</span><br><small class="mut">${extra}</small></div><div class="fila" style="gap:6px">${acciones}</div></div>`;
  return lista.map((a) => fila(a.tipo === 'application/pdf' ? '📄' : '🖼️', a.nombre, pesoTxt(a.tamano),
    `${btnIA(`data-ia-arch="${a.id}"`)}<button class="btn chico sec" data-ver-arch="${a.id}" data-nom="${esc(a.nombre)}">Ver</button><button class="btn chico borde" data-del-arch="${a.id}" title="Quitar">🗑</button>`)).join('') +
    pendientes.map((f, i) => fila('⏳', f.name, 'Se sube al guardar', `${btnIA(`data-ia-pend="${i}"`)}<button class="btn chico borde" data-quitar-pend="${i}">✕</button>`)).join('') ||
    '<p class="mut mb0"><small>Sin archivos todavía.</small></p>';
}
// Caja de adjuntos reutilizable. destino: {registro_id} o {ambito}. Si no hay destino aún, guarda pendientes.
function cajaAdjuntos(raiz, destinoInicial, opciones = {}) {
  const estado = { destino: destinoInicial, lista: [], pendientes: [] };
  const caja = $('[data-adjuntos]', raiz);
  const pintar = () => {
    $('[data-lista-arch]', caja).innerHTML = htmlListaArchivos(estado.lista, estado.pendientes, !!opciones.alLeerIA);
    caja.querySelectorAll('[data-ia-arch]').forEach((b) => (b.onclick = () => leerConIA({ archivo_id: Number(b.dataset.iaArch) }, b, opciones.alLeerIA)));
    caja.querySelectorAll('[data-ia-pend]').forEach((b) => (b.onclick = async () => {
      const f = estado.pendientes[Number(b.dataset.iaPend)];
      try {
        const cuerpo = f.type === 'application/pdf'
          ? { nombre: f.name, tipo: 'application/pdf', base64: await leerBase64(f) }
          : { nombre: f.name, tipo: 'image/jpeg', base64: await comprimirImagen(f) };
        leerConIA(cuerpo, b, opciones.alLeerIA);
      } catch (e) { toast(e.message); }
    }));
    caja.querySelectorAll('[data-ver-arch]').forEach((b) => (b.onclick = () => abrirArchivo(b.dataset.verArch, b.dataset.nom)));
    caja.querySelectorAll('[data-del-arch]').forEach((b) => (b.onclick = async () => {
      if (!confirm('¿Quitar este archivo?')) return;
      await api('DELETE', '/api/archivos/' + b.dataset.delArch); await cargar();
    }));
    caja.querySelectorAll('[data-quitar-pend]').forEach((b) => (b.onclick = () => { estado.pendientes.splice(Number(b.dataset.quitarPend), 1); pintar(); }));
  };
  const cargar = async () => {
    if (estado.destino) {
      const q = estado.destino.registro_id ? 'registro_id=' + estado.destino.registro_id : 'ambito=' + estado.destino.ambito;
      estado.lista = await api('GET', '/api/archivos?' + q);
    }
    pintar();
  };
  const subirTodos = async (files) => {
    for (const f of files) {
      try { toast('Subiendo ' + f.name + '…'); await subirArchivo(f, estado.destino); }
      catch (e) { toast(e.message); }
    }
  };
  $('input[type=file]', caja).onchange = async (e) => {
    const files = [...e.target.files]; e.target.value = '';
    if (!estado.destino) { estado.pendientes.push(...files); pintar(); return; }
    await subirTodos(files); await cargar(); toast('Archivo guardado ✓');
  };
  cargar();
  return {
    // para registros nuevos: al guardar, se sube lo pendiente
    async alGuardar(destino) {
      if (!estado.pendientes.length) return;
      estado.destino = destino; await subirTodos(estado.pendientes); estado.pendientes = [];
    },
  };
}

// Vuelca lo que leyó la IA en el formulario de estudio
function llenarConIA(o, r) {

function formRegistro(tipo, titulo, campos, existente, alGuardar) {

      const extras = Object.fromEntries(Object.entries((existente && existente.datos) || {}).filter(([k]) => !todos.some((c) => c.k === k)));

        render();

      if (!confirm('¿Borrar este registro?')) return;

function puntosDia(d) {
  if (!d) return 0;

  n += Object.values(d.comidas || {}).filter(Boolean).length >= 3 ? 1 : 0;
  n += (d.agua || 0) >= 6 ? 1 : 0;
  return n;
}

  let r = 0, f = hoyStr();
  if (puntosDia(S.dias[f]) < 3) f = sumarDias(f, -1);
  while (puntosDia(S.dias[f]) >= 3) { r++; f = sumarDias(f, -1); }
  return r;
}
function planDeHoy(fecha = hoyStr()) {
  const p = fuente().plan;

  const i = difDias(fecha, p.inicio);
  if (i < 0 || i > 6) return null;

}

function chipsExclusion(set, attr) {
  return `<p class="mut mb0">Grupos completos:</p>` +
    Object.entries(GRUPOS).map(([g, ks]) => `<span class="chip ${ks.every((k) => set.has(k)) ? 'no' : ''}" data-${attr}g="${esc(g)}">${esc(g)}</span>`).join('') +
    `<p class="mut mb0 mt">Alimentos sueltos:</p>` +
    Object.entries(ING).sort((a, b) => a[1][0].localeCompare(b[1][0])).map(([k, [n]]) => `<span class="chip ${set.has(k) ? 'no' : ''}" data-${attr}i="${k}">${esc(n)}</span>`).join('');
}
function lunesDe(fecha) {
  const d = parseF(fecha); const dif = (d.getDay() + 6) % 7;
  return sumarDias(fecha, -dif);
}

function generarPlan(inicio) {
  const ok = recetasPermitidas();
  const de = (m) => ok.filter((r) => r.m.includes(m));
  const dias = [];
  const usados = {};
  const elegir = (m, evitar, preferTag) => {
    let c = de(m).filter((r) => !evitar.includes(r.id));
    if (preferTag) { const t = c.filter((r) => r.tag === preferTag); if (t.length) c = t; }
    if (!c.length) c = de(m);
    if (!c.length) return null;
    // menos usadas primero
    const min = Math.min(...c.map((r) => usados[r.id] || 0));
    const r = azar(c.filter((x) => (usados[x.id] || 0) === min));
    usados[r.id] = (usados[r.id] || 0) + 1;
    return r.id;
  };
  for (let i = 0; i < 7; i++) {
    const prev = dias[i - 1] || {};
    const ev = Object.values(prev);
    const dia = {};
    dia.d = elegir('d', ev);
    dia.k = elegir('k', [...ev, dia.d]);
    dia.m = elegir('m', [...ev, dia.d, dia.k]);
    // pescado días 1 y 4; legumbres días 2 y 5
    const tagA = i === 0 || i === 3 ? 'pescado' : i === 1 || i === 4 ? 'legumbre' : null;
    dia.a = elegir('a', ev, tagA);
    dia.c = elegir('c', [...ev, dia.a]);
    dias.push(dia);
  }
  return { inicio, dias, creado: hoyStr() };
}

function elegirReceta(opc, cb) {
  modal(`<div class="fila entre"><h2 class="mb0">Elegir otra opción</h2><button class="btn chico borde" data-x>✕</button></div>
    ${opc.map((r) => `<div class="lista-item" data-r="${r.id}" style="cursor:pointer"><b>${esc(r.n)}</b><br><small>${esc(r.p.slice(0, 90))}…</small></div>`).join('')}`, (o) => {
    $('[data-x]', o).onclick = () => o.remove();
    o.querySelectorAll('[data-r]').forEach((el) => (el.onclick = () => { o.remove(); cb(el.dataset.r); }));
  });

function caminata(nivel) {
  const meta = CAMINATA_MIN[nivel - 1] * 60;
  let t = 0, pausa = false;
  const intervalos = nivel >= 4 ? [[60, 120], [120, 120], [120, 60]][nivel - 4] : null; // [rápido, normal]
  const fs = document.createElement('div');
  fs.className = 'full-screen';
  document.body.appendChild(fs);
  pantallaEncendida(true);
  const fase = () => {
    if (!intervalos) return '';
    const ciclo = intervalos[0] + intervalos[1];
    return (t % ciclo) < intervalos[0] ? '🏃 Rápido' : '🚶 Normal';
  };
  let ultFase = fase();
  const pintar = () => {
    fs.innerHTML = `<button class="cerrar" data-x>✕</button>
      <h2>Caminata · nivel ${nivel}</h2>
      ${intervalos ? `<div style="font-size:1.6rem;font-weight:700;margin-top:8px">${fase()}</div>` : `<p>${CAMINATA_TXT[nivel - 1]}</p>`}
      <div class="reloj">${mmss(t)}</div>
      <p style="opacity:.85">Meta: ${mmss(meta)}</p>
      <div class="prog" style="width:80%;background:rgba(255,255,255,.25)"><div style="width:${Math.min(100, (t / meta) * 100)}%;background:#fff"></div></div>
      <div class="fila mt" style="gap:10px"><button class="btn sec" data-p>${pausa ? '▶ Seguir' : '⏸ Pausa'}</button><button class="btn" data-fin>Terminar</button></div>`;
    $('[data-x]', fs).onclick = cerrar;
    $('[data-p]', fs).onclick = () => { pausa = !pausa; pintar(); };
    $('[data-fin]', fs).onclick = () => { cerrar(); finSesion('Caminata', nivel, Math.max(1, Math.round(t / 60)), 'caminata'); };
  };
  const iv = setInterval(() => {
    if (pausa) return;
    t++;
    const f = fase(); if (f !== ultFase) { ultFase = f; vibrar([200, 100, 200]); campana(f.includes('Rápido') ? 660 : 440); }
    if (t === meta) { vibrar([300, 150, 300]); campana(); }
    pintar();
  }, 1000);
  function cerrar() { clearInterval(iv); pantallaEncendida(false); fs.remove(); }
  pintar();
}

function reproducirRutina(clave, nivel) {
  const R = RUTINAS[clave];
  const rondas = R.rondas[nivel - 1];
  const pasos = [];
  for (let r = 1; r <= rondas; r++) R.ej.forEach((e, i) => {
    pasos.push({ ...e, val: e.v[nivel - 1], ronda: r });
    const ultimo = r === rondas && i === R.ej.length - 1;
    if (!ultimo && clave !== 'estirar') pasos.push({ descanso: true, val: i === R.ej.length - 1 ? 60 : 30 });
  });
  let idx = 0, t = 0, pausa = false;
  const inicio = Date.now();
  const fs = document.createElement('div');
  fs.className = 'full-screen';
  document.body.appendChild(fs);
  pantallaEncendida(true);
  const pintar = () => {
    const p = pasos[idx];
    const sig = pasos.slice(idx + 1).find((x) => !x.descanso);
    const restante = p.t === 's' || p.descanso ? p.val - t : null;
    fs.className = 'full-screen' + (p.descanso ? ' calmo' : '');
    fs.innerHTML = `<button class="cerrar" data-x>✕</button>
      <small style="opacity:.8">${R.n} · ${p.descanso ? 'Descanso' : `Ronda ${p.ronda} de ${rondas}`} · paso ${idx + 1}/${pasos.length}</small>
      <h1 style="margin-top:14px">${p.descanso ? '😮‍💨 Descansa' : esc(p.n)}</h1>
      ${p.descanso ? `<p>Respira tranquilo.${sig ? ' Lo que sigue: <b>' + esc(sig.n) + '</b>' : ''}</p>` : `<p class="paso-txt">${esc(p.d)}</p>`}
      <div class="reloj">${restante !== null ? mmss(restante) : p.val + (p.lado ? ' x lado' : ' rep.')}</div>
      <div class="fila" style="gap:10px">
        ${restante !== null ? `<button class="btn sec" data-p>${pausa ? '▶' : '⏸'}</button>` : ''}
        <button class="btn" data-ok>${restante !== null ? 'Saltar ⏭' : 'Listo ✓'}</button>
      </div>`;
    $('[data-x]', fs).onclick = () => { if (confirm('¿Salir de la rutina?')) cerrar(); };
    const bp = $('[data-p]', fs); if (bp) bp.onclick = () => { pausa = !pausa; pintar(); };
    $('[data-ok]', fs).onclick = siguiente;
  };
  const siguiente = () => {
    idx++; t = 0;
    if (idx >= pasos.length) {
      cerrar(); campana(660);
      finSesion(R.n, nivel, Math.max(1, Math.round((Date.now() - inicio) / 60000)), clave === 'estirar' ? 'fuerza' : 'fuerza');
      return;
    }
    vibrar(); pintar();
  };
  const iv = setInterval(() => {
    if (pausa) return;
    const p = pasos[idx];
    if (p.t === 's' || p.descanso) {
      t++;
      if (p.val - t === 3) vibrar(80);
      if (t >= p.val) { campana(p.descanso ? 660 : 528); siguiente(); return; }
      const r = $('.reloj', fs); if (r) r.textContent = mmss(p.val - t);
    }
  }, 1000);
  function cerrar() { clearInterval(iv); pantallaEncendida(false); fs.remove(); }
  pintar();
}

function respiracion(minutos, oscuro) {
  const total = minutos * 60;
  let t = 0, fase = 'in', ft = 0;
  const fs = document.createElement('div');
  fs.className = 'full-screen calmo';
  if (oscuro) fs.style.background = '#0d1716';
  fs.innerHTML = `<button class="cerrar" data-x>✕</button>
    <div class="circulo" id="circ">Inhala</div>
    <div id="cuenta" style="font-size:1.4rem;opacity:.9">4</div>
    <p style="opacity:.75" id="rest">${mmss(total)}</p>`;
  document.body.appendChild(fs);
  pantallaEncendida(true);
  const circ = $('#circ', fs);
  const aplicar = () => {
    circ.style.transitionDuration = fase === 'in' ? '4s' : '6s';
    circ.style.transform = fase === 'in' ? 'scale(1.25)' : 'scale(0.8)';
    circ.textContent = fase === 'in' ? 'Inhala' : 'Exhala';
  };
  requestAnimationFrame(() => { circ.style.transform = 'scale(0.8)'; requestAnimationFrame(aplicar); });
  const iv = setInterval(async () => {
    t++; ft++;
    const dur = fase === 'in' ? 4 : 6;
    if (ft >= dur) { fase = fase === 'in' ? 'out' : 'in'; ft = 0; aplicar(); }
    $('#cuenta', fs).textContent = (fase === 'in' ? 4 : 6) - ft;
    $('#rest', fs).textContent = mmss(total - t);
    if (t >= total) { cerrar(); campana(); await registrarCalma('Respiración 4-6', minutos); }
  }, 1000);
  function cerrar() { clearInterval(iv); pantallaEncendida(false); fs.remove(); }
  $('[data-x]', fs).onclick = async () => { cerrar(); if (t >= 60) await registrarCalma('Respiración 4-6', Math.round(t / 60)); };
}

function meditar(minutos, guiada) {
  const total = minutos * 60;
  let t = 0, pausa = false;
  const cada = Math.max(25, Math.floor(total / GUIA_MEDITACION.length));
  const fs = document.createElement('div');
  fs.className = 'full-screen calmo';
  document.body.appendChild(fs);
  pantallaEncendida(true); campana(432);
  const pintar = () => {

    $('[data-x]', fs).onclick = async () => { cerrar(); if (t >= 60) await registrarCalma(guiada ? 'Meditación guiada' : 'Silencio', Math.round(t / 60)); };

  };

    if (pausa) return;
    t++;
    if (t >= total) { cerrar(); campana(432); await registrarCalma(guiada ? 'Meditación guiada' : 'Silencio', minutos); return; }
    if (guiada && t % cada === 0) pintar(); else { const r = $('.reloj', fs); if (r) r.textContent = mmss(total - t); }
  }, 1000);
  function cerrar() { clearInterval(iv); pantallaEncendida(false); fs.remove(); }
  pintar();
}

function horasSueno(d) {
  if (!d.acoste || !d.levante) return null;
  const [a1, a2] = d.acoste.split(':').map(Number), [l1, l2] = d.levante.split(':').map(Number);
  let m = (l1 * 60 + l2) - (a1 * 60 + a2); if (m <= 0) m += 1440;
  return Math.max(0, (m - (d.tardo || 0)) / 60);
}
function estadoLab(def, v) {
  if (v === null || v === undefined || v === '' || !def.ok) return '';
  if (def.ok(v)) return '<span class="badge">OK</span>';
  if (def.medio && def.medio(v)) return '<span class="badge medio">Revisar</span>';
  return '<span class="badge alto">Fuera de rango</span>';
}
function sparkline(vals, w = 300, h = 60) {
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * (w - 10) + 5},${h - 5 - ((v - min) / r) * (h - 10)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px"><polyline points="${pts}" fill="none" stroke="#1f6f5c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v, i) => `<circle cx="${(i / (vals.length - 1)) * (w - 10) + 5}" cy="${h - 5 - ((v - min) / r) * (h - 10)}" r="3.5" fill="#1f6f5c"/>`).join('')}</svg>`;
}

        if (p) L.push(`Peso: ${p.datos.peso} kg${p.datos.cintura ? ' · Cintura: ' + p.datos.cintura + ' cm' : ''}${p.datos.presion ? ' · Presión: ' + p.datos.presion : ''} (${fechaCorta(p.fecha)})`);
        if (uib) { L.push(`\nÚltimo InBody (${fechaCorta(uib.fecha)}):`); INBODY.forEach((v) => uib.datos[v.k] != null && L.push(`• ${v.n}: ${uib.datos[v.k]} ${v.u}`)); }
        if (ult) { L.push(`\nÚltimo análisis (${fechaCorta(ult.fecha)}):`); LAB.forEach((v) => ult.datos[v.k] != null && L.push(`• ${v.n}: ${ult.datos[v.k]} ${v.u}${(ult.datos.refs || {})[v.k] ? ` (ref.: ${ult.datos.refs[v.k]})` : ''}`)); if (ult.datos.orina) L.push(`• Orina: ${ult.datos.orina}`); }
        if (s14.length) {
          L.push(`\nSueño (últimas ${s14.length} noches registradas):`);
          if (hs.length) L.push(`• Horas promedio: ${prom(hs).toFixed(1)}`);
          L.push(`• Despertares promedio: ${prom(s14.map((r) => r.datos.despertares || 0)).toFixed(1)}`);
          L.push(`• Noches con ronquido: ${s14.filter((r) => r.datos.ronque).length} · con boca seca: ${s14.filter((r) => r.datos.boca_seca).length} · con pausas/ahogo: ${s14.filter((r) => r.datos.pausas).length}`);
        }
        const e30 = epi.filter((r) => difDias(hoy, r.fecha) < 30);
        L.push(`\nMomentos de ansiedad últimos 30 días: ${e30.length}`);
        L.push(`Ejercicio últimos 30 días: ${ej.filter((r) => difDias(hoy, r.fecha) < 30).reduce((a, r) => a + (Number(r.datos.minutos) || 0), 0)} minutos`);
        const mol = ej.filter((r) => r.datos.molestia && difDias(hoy, r.fecha) < 60);
        if (mol.length) L.push(`Molestias durante ejercicio (60 días): ${mol.length}${mol[0].datos.nota ? ' — ' + mol[0].datos.nota : ''}`);
        if (psi.length) L.push(`Sesiones de psicología registradas: ${psi.length}`);
        compartir(L.join('\n'));
      };
    });
  } else if (sub === 'episodio') {
    const regs = await registros('episodio');
    cuerpo = `<button class="btn full" id="nuevo" style="margin-bottom:12px">+ Registrar un momento</button>
      <div class="card">${regs.map((r) => `<div class="lista-item" data-ed="${r.id}" style="cursor:pointer"><small>${fechaCorta(r.fecha)} ${esc(r.datos.hora || '')} · ${esc(r.datos.donde || '')} · ${r.datos.intensidad ?? '?'}/10</small><div>💭 ${esc(r.datos.pense || '—')}</div>${r.datos.ayudo ? `<div><small>✅ ${esc(r.datos.ayudo)}</small></div>` : ''}</div>`).join('') || '<p class="mut">Sin registros.</p>'}</div>`;
    setTimeout(() => {
      $('#nuevo').onclick = () => formEpisodio();
      document.querySelectorAll('[data-ed]').forEach((el) => (el.onclick = () => formEpisodio(regs.find((r) => r.id == el.dataset.ed))));
    });
  } else {
    const regs = await registros(sub);
    const linea = {
      estudio: (r) => `<b>${esc(r.datos.tipo)}</b>${r.datos.lugar ? ' · ' + esc(r.datos.lugar) : ''}${r.adjuntos ? ` <span class="badge">📎 ${r.adjuntos}</span>` : ''}<br><small>${r.datos.resultado ? esc(r.datos.resultado.slice(0, 100))
        : ES_INBODY(r) ? [r.datos.ib_peso != null && `Peso ${r.datos.ib_peso} kg`, r.datos.ib_grasa_pct != null && `Grasa ${r.datos.ib_grasa_pct}%`, r.datos.ib_musculo != null && `Músculo ${r.datos.ib_musculo} kg`].filter(Boolean).join(' · ')
        : (() => { const vs = LAB.filter((v) => r.datos[v.k] != null); return vs.slice(0, 5).map((v) => v.n.split(' (')[0] + ' ' + r.datos[v.k]).join(' · ') + (vs.length > 5 ? ` · y ${vs.length - 5} valores más` : ''); })()}</small>`,
      consulta: (r) => `<b>${esc(r.datos.especialidad)}</b>${r.datos.profesional ? ' · ' + esc(r.datos.profesional) : ''}${r.adjuntos ? ` <span class="badge">📎 ${r.adjuntos}</span>` : ''}<br><small>${esc((r.datos.dijo || r.datos.motivo || '').slice(0, 100))}</small>`,
      psicologo: (r) => `<b>Sesión</b> ${r.datos.animo ? ANIMOS[r.datos.animo - 1] : ''}<br><small>${esc((r.datos.aprendi || r.datos.temas || '').slice(0, 100))}</small>${r.datos.tarea ? `<br><small>📝 ${esc(r.datos.tarea.slice(0, 80))}</small>` : ''}`,
      sueno: (r) => { const h = horasSueno(r.datos); return `<b>${h !== null ? h.toFixed(1) + ' h' : '—'}</b> · ${r.datos.despertares ?? '?'} despertares ${r.datos.calidad ? ['😫', '😴', '😐', '🙂', '😃'][r.datos.calidad - 1] : ''}<br><small>${[r.datos.ronque && 'ronquido', r.datos.boca_seca && 'boca seca', r.datos.pausas && 'pausas'].filter(Boolean).join(' · ')}</small>`; },
      peso: (r) => `<b>${esc(r.datos.peso ?? '—')} kg</b>${r.datos.cintura ? ' · ' + esc(r.datos.cintura) + ' cm' : ''}${r.datos.presion ? ' · ' + esc(r.datos.presion) : ''}`,
    }[sub];
    let extra = '';
    if (sub === 'peso') {
      const vals = regs.filter((r) => r.datos.peso).slice(0, 20).reverse().map((r) => Number(r.datos.peso));
      if (vals.length >= 2) extra = `<div class="card"><h3>Evolución del peso</h3>${sparkline(vals)}<small>${vals[0]} → ${vals[vals.length - 1]} kg</small></div>`;
    }
    if (sub === 'estudio') {
      const ib = regs.filter(ES_INBODY);
      if (ib.length) {
        const [a, b] = ib;
        const serie = (k) => ib.filter((r) => r.datos[k] != null).slice(0, 12).reverse().map((r) => Number(r.datos[k]));
        const gr = serie('ib_grasa_pct'), mu = serie('ib_musculo');
        extra += `<div class="card"><h3>⚖️ Composición corporal (InBody)</h3><table class="val"><tr><th>Valor</th>${b ? `<th>${fechaCorta(b.fecha)}</th>` : ''}<th>${fechaCorta(a.fecha)}</th></tr>
          ${INBODY.filter((v) => a.datos[v.k] != null || (b && b.datos[v.k] != null)).map((v) => `<tr><td>${v.n}</td>${b ? `<td>${b.datos[v.k] ?? '—'}</td>` : ''}<td><b>${a.datos[v.k] ?? '—'}</b> ${b ? flechaInbody(v, a.datos[v.k], b.datos[v.k]) : ''}</td></tr>`).join('')}</table>
          ${b ? '<p class="mut mb0 mt"><small>Verde: va en buena dirección (más músculo, menos grasa). Rojo: al revés.</small></p>' : ''}
          ${gr.length >= 2 ? `<p class="mt mb0"><small>% de grasa</small></p>${sparkline(gr)}` : ''}${mu.length >= 2 ? `<p class="mb0"><small>Masa muscular</small></p>${sparkline(mu)}` : ''}</div>`;
      }
      const lab = regs.filter((r) => r.datos.tipo === 'Análisis de sangre');
      if (lab.length >= 2) {
        const [a, b] = lab;
        extra += `<div class="card"><h3>Comparación de análisis</h3><table class="val"><tr><th>Valor</th><th>${fechaCorta(b.fecha)}</th><th>${fechaCorta(a.fecha)}</th><th></th></tr>
          ${LAB.filter((v) => a.datos[v.k] != null || b.datos[v.k] != null).map((v) => {
            const va = a.datos[v.k], vb = b.datos[v.k];
            const fl = va != null && vb != null ? (va < vb ? '↓' : va > vb ? '↑' : '=') : '';
            return `<tr><td>${v.n}${(a.datos.refs || {})[v.k] ? `<br><small class="mut">ref. ${esc(a.datos.refs[v.k])}</small>` : ''}</td><td>${vb ?? '—'}</td><td><b>${va ?? '—'}</b> ${fl}</td><td>${estadoLab(v, va)}</td></tr>`;
          }).join('')}</table></div>`;
      }
    }
    if (sub === 'sueno' && regs.length) {
      const ult = regs.slice(0, 14);
      const hs = ult.map((r) => horasSueno(r.datos)).filter((x) => x !== null);
      extra = `<div class="card suave"><small>Últimas ${ult.length} noches</small><div class="fila entre mt">
        <div><b>${hs.length ? (hs.reduce((a, b) => a + b, 0) / hs.length).toFixed(1) : '—'} h</b><br><small>promedio</small></div>
        <div><b>${(ult.reduce((a, r) => a + (r.datos.despertares || 0), 0) / ult.length).toFixed(1)}</b><br><small>despertares</small></div>
        <div><b>${ult.filter((r) => r.datos.boca_seca).length}</b><br><small>boca seca</small></div>
        <div><b>${ult.filter((r) => r.datos.ronque).length}</b><br><small>ronquido</small></div></div></div>`;
    }
    cuerpo = `<button class="btn full" id="nuevo" style="margin-bottom:12px">+ ${sub === 'sueno' ? 'Registrar la noche' : 'Agregar'}</button>${extra}
      <div class="card">${regs.map((r) => `<div class="lista-item" data-ed="${r.id}" style="cursor:pointer"><small class="mut">${fechaCorta(r.fecha)}</small><br>${linea(r)}</div>`).join('') || '<p class="mut">Todavía no hay registros.</p>'}</div>`;
    setTimeout(() => {
      $('#nuevo').onclick = () => formRegistro(sub, TITULOS[sub], CAMPOS[sub]);
      document.querySelectorAll('[data-ed]').forEach((el) => (el.onclick = () => formRegistro(sub, TITULOS[sub], CAMPOS[sub], regs.find((r) => r.id == el.dataset.ed))));
    });
  }

  $('#app').innerHTML = `${encabezado('Mi salud', 'Todo en un lugar para tus médicos')}
    <div class="tabs">${tabs.map(([k, t]) => `<span class="chip ${sub === k ? 'on' : ''}" data-sub="${k}">${t}</span>`).join('')}</div>${cuerpo}`;
  document.querySelectorAll('[data-sub]').forEach((el) => (el.onclick = () => { S.sub.salud = el.dataset.sub; render(); }));
}

/* =========================================================
   AJUSTES
   ========================================================= */
const CAMPOS_PERFIL = [
  { k: 'edad', l: 'Edad', t: 'number' },
  { k: 'altura', l: 'Altura (cm)', t: 'number' },
  { t: 'titulo', l: 'Para los momentos de ansiedad' },
  { k: 'recordatorio', l: 'Algo que necesito recordar en ese momento', t: 'textarea', ph: 'Ej.: Ya me revisaron y estoy bien. Las otras veces también pasó.' },
  { k: 'contactoNombre', l: 'Persona de confianza', t: 'text', ph: 'Ej.: mi pareja, mi hermana' },
  { k: 'contactoTel', l: 'Su teléfono', t: 'tel' },
  { k: 'planRescate', l: 'Indicaciones de mi médico o psicólogo para una crisis', t: 'textarea', ph: 'Copia acá lo que te indicaron, tal cual.' },
];
async function vistaAjustes() {
  const p = { ...perfil() };
  const oracionOn = p.oracion !== false;
  $('#app').innerHTML = `<div class="top"><button class="btn chico borde" onclick="ir('hoy')">← Volver</button><h1 class="mb0">Ajustes</h1><span></span></div>
  ${S.usuario.admin ? `<div class="card verde" id="admin"><h2>📊 Panel del dueño</h2><p class="mb0">Cargando…</p></div>` : ''}
  <div class="card"><h2>Mi perfil</h2>
    <label class="f">Nombre</label><input class="i" id="aj-nombre" value="${esc(S.usuario.nombre)}">
    ${htmlCampos(CAMPOS_PERFIL, p)}<button class="btn full mt" id="perf-ok">Guardar</button></div>
  <div class="card"><h2>Mi día</h2>
    <div class="check ${oracionOn ? 'ok' : ''}" id="aj-oracion"><span class="caja">✓</span><span class="txt" style="text-decoration:none;color:inherit">🙏 Incluir momentos de oración</span></div>
    ${S.config.ia ? `<div class="check ${p.consentIA === true ? 'ok' : ''}" id="aj-ia"><span class="caja">✓</span><span class="txt" style="text-decoration:none;color:inherit">✨ Permitir leer mis estudios con IA (OpenAI)</span></div>` : ''}
    <button class="btn full sec mt" onclick="bienvenida().then(()=>ir('hoy'))">Ver de nuevo la bienvenida</button></div>
  <div class="card"><h2>Contraseña</h2>
    <label class="f">Actual</label><input class="i" type="password" id="pw-a" autocomplete="current-password">
    <label class="f">Nueva</label><input class="i" type="password" id="pw-n" autocomplete="new-password">
    <button class="btn full sec mt" id="pw-ok">Cambiar contraseña</button>
    <p class="mut mb0 mt"><small>Al cambiarla se cierra la sesión en tus otros dispositivos.</small></p></div>
  <div class="card"><h2>Instalar en el celular</h2>
    <p class="mut mb0">En Chrome: menú ⋮ → <b>Agregar a la pantalla principal</b>. En iPhone (Safari): compartir → <b>Agregar a inicio</b>. Queda como una app más.</p></div>
  <div class="card"><h2>Mis datos y privacidad</h2>
    <p class="mut">Tus datos son tuyos. Puedes llevártelos o borrarlos cuando quieras.</p>
    <button class="btn full sec" id="exportar">⬇️ Descargar mis datos</button>
    <button class="btn full borde mt" onclick="verLegal('privacidad')">Política de privacidad</button>
    <button class="btn full borde mt" onclick="verLegal('terminos')">Términos y condiciones</button>
    ${S.config.soporte ? `<a class="btn full borde mt" href="mailto:${esc(S.config.soporte)}" style="text-decoration:none">✉️ Escribir a soporte</a>` : ''}
  </div>
  <button class="btn full borde" onclick="salir()">Cerrar sesión</button>
  <button class="btn full borde mt" id="borrar" style="color:var(--rojo);border-color:#f0c9c0">Borrar mi cuenta</button>
  <p class="centro mut mt"><small>Vamos Pa' Arriba · I8A Project · ${esc(S.usuario.email)}</small></p>`;

  $('#perf-ok').onclick = async () => {
    const v = leerCampos(CAMPOS_PERFIL, document);
    const nom = $('#aj-nombre').value.trim();
    if (nom && nom !== S.usuario.nombre) v.nombre_cuenta = nom;
    await guardarPerfil(v); toast('Guardado ✓');
  };
  const ajIa = $('#aj-ia');
  if (ajIa) ajIa.onclick = async (e) => {
    e.currentTarget.classList.toggle('ok');
    await guardarPerfil({ consentIA: e.currentTarget.classList.contains('ok') }); toast('Guardado ✓');
  };
  $('#aj-oracion').onclick = async (e) => {
    e.currentTarget.classList.toggle('ok');
    await guardarPerfil({ oracion: e.currentTarget.classList.contains('ok') }); toast('Guardado ✓');
  };
  $('#pw-ok').onclick = async () => {
    try {
      const r = await api('PATCH', '/api/password', { actual: $('#pw-a').value, nueva: $('#pw-n').value });
      if (r.token) { S.token = r.token; localStorage.setItem('vpa_token', r.token); }
      toast('Contraseña cambiada ✓'); $('#pw-a').value = $('#pw-n').value = '';
    } catch (e) { toast(e.message); }
  };
  $('#exportar').onclick = async () => {
    try {
      const r = await fetch('/api/exportar', { headers: { Authorization: 'Bearer ' + S.token } });
      if (!r.ok) throw new Error('No se pudo descargar');
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = `mis-datos-vamos-pa-arriba-${hoyStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { toast(e.message); }
  };
  $('#borrar').onclick = () => modal(`<h2>Borrar mi cuenta</h2>
    <p>Se borran <b>para siempre</b> tu cuenta y todo lo que cargaste: hábitos, comidas, ejercicio, estudios, notas. No se puede deshacer.</p>
    <p class="mut">Si quieres guardar una copia, primero toca "Descargar mis datos".</p>
    <label class="f">Escribe tu contraseña para confirmar</label><input class="i" type="password" id="del-pw">
    <button class="btn full rojo mt" data-ok>Borrar todo</button><button class="btn full borde mt" data-x>Cancelar</button>`, (o) => {
    $('[data-x]', o).onclick = () => o.remove();
    $('[data-ok]', o).onclick = async () => {
      try { await api('DELETE', '/api/cuenta', { password: $('#del-pw', o).value }); o.remove(); salir(); toast('Tu cuenta fue borrada. ¡Gracias por haberla usado! 🌱'); }
      catch (e) { toast(e.message); }
    };
  });
  if (S.usuario.admin) {
    try {
      const e = await api('GET', '/api/admin/estadisticas');
      $('#admin').innerHTML = `<h2>📊 Panel del dueño</h2>
        <div class="grid2" style="margin-top:8px">
          ${[['Usuarios', e.usuarios], ['Familias', e.familias], ['Activos 7 días', e.activos7], ['Activos 30 días', e.activos30], ['Nuevos 7 días', e.nuevos7], ['Nuevos 30 días', e.nuevos30]]
            .map(([t, n]) => `<div><div class="big">${n}</div><small style="color:#fff;opacity:.85">${t}</small></div>`).join('')}
        </div><p class="mb0 mt"><small style="color:#fff;opacity:.85">${e.registros30} registros y ${e.ia30} lecturas con IA en los últimos 30 días. Solo ves totales, nunca los datos de nadie.</small></p>`;
    } catch (err) { $('#admin').innerHTML = `<p class="mb0">No se pudieron cargar las estadísticas.</p>`; }
  }
}

/* =========================================================
   INICIO
   ========================================================= */
async function iniciar() {
  try { S.config = await api('GET', '/api/config'); } catch (e) { S.config = {}; }
  const m = location.hash.match(/^#reset=([a-f0-9]{64})$/);
  if (m) { S.resetToken = m[1]; return vistaLogin('reset'); }
  if (!S.token) return vistaLogin();
  try {
    if (!S.usuario) S.usuario = await api('GET', '/api/yo');
  } catch (e) { return; }
  if (!S.usuario.acepto && !(await pedirConsentimiento())) return;
  let destino = 'hoy';
  if (!perfil().bienvenida) destino = await bienvenida();
  $('#nav').classList.remove('oculto');
  ir(destino);
}
window.addEventListener('hashchange', () => { if (/^#reset=/.test(location.hash)) { S.usuario = null; iniciar(); } });
iniciar();
</script>
</body>
