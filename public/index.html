<div id="app"></div>
<nav class="nav oculto" id="nav">

<script>
/* =========================================================
   Vamos Pa' Arriba — app personal
   ========================================================= */

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const fechaStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyStr = () => fechaStr(new Date());
const parseF = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const sumarDias = (s, n) => { const d = parseF(s); d.setDate(d.getDate() + n); return fechaStr(d); };
const difDias = (a, b) => Math.round((parseF(a) - parseF(b)) / 86400000);
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DIAS_C = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fechaLarga = (s) => { const d = parseF(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fechaCorta = (s) => { const d = parseF(s); return `${d.getDate()}/${d.getMonth() + 1}/${String(d.getFullYear()).slice(2)}`; };
const azar = (arr) => arr[Math.floor(Math.random() * arr.length)];
const mmss = (s) => `${Math.floor(s / 60)}:${pad(Math.max(0, Math.floor(s % 60)))}`;

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function vibrar(ms = 150) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// Campanita suave (Web Audio, sin archivos)
let audioCtx = null;
/* ---------- Voz guía (síntesis de voz del celular, sin archivos ni internet) ---------- */
const HAY_VOZ = 'speechSynthesis' in window;
let vozES = null;
function elegirVoz() {
  const vs = speechSynthesis.getVoices();
  const norm = (l) => (l || '').replace('_', '-').toLowerCase();
  for (const pref of ['es-ar', 'es-us', 'es-419', 'es-mx', 'es-es']) { const v = vs.find((x) => norm(x.lang) === pref); if (v) return v; }
  return vs.find((x) => norm(x.lang).startsWith('es')) || null;
}
if (HAY_VOZ) { vozES = elegirVoz(); speechSynthesis.onvoiceschanged = () => { vozES = elegirVoz(); }; }
// S.silencio: el botón 🔇 calla solo la sesión actual (no cambia el ajuste general)
// La voz solo se considera apagada si se apagó desde Ajustes (antes el botón 🔇 la apagaba para siempre por error)
const vozApagada = () => perfil().voz === false && perfil().vozAjustes === true;
const vozActiva = () => (HAY_VOZ || !!S.config.vozNatural) && !vozApagada() && !S.silencio;
let avisoVozDado = false;
function avisarFalloVoz() {
  if (avisoVozDado) return; avisoVozDado = true;
  toast('No se pudo reproducir la voz. Revisa en el celular: Ajustes → Texto a voz, que haya una voz en español.');
}
// ---- Dos motores de voz ----
// "natural": audio generado en el servidor (OpenAI) y guardado en caché. Funciona igual en cualquier celular.
// "celular": la voz del propio teléfono (sin internet), que en algunos equipos no anda.
const audioVoz = new Audio();
audioVoz.preload = 'auto';
const SILENCIO = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
const cacheVoz = new Map();
let turnoVoz = 0, colaPrecarga = Promise.resolve();
const limpiarTxt = (t) => String(t).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const usarNatural = () => !!S.config.vozNatural && (perfil().motorVoz || 'natural') === 'natural' && !S.vozFallo;
function urlVoz(txt, estilo) {
  const k = estilo + '|' + txt;
  if (!cacheVoz.has(k)) cacheVoz.set(k, fetch('/api/voz', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token },
    body: JSON.stringify({ texto: txt, estilo }),
  }).then((r) => { if (!r.ok) throw new Error('voz'); return r.blob(); }).then((b) => URL.createObjectURL(b))
    .catch((e) => { cacheVoz.delete(k); throw e; }));
  return cacheVoz.get(k);
}
// Prepara de antemano las frases que se van a decir (de a una, para no saturar)
function precargarVoz(textos, estilo) {
  if (!usarNatural() || !vozActiva()) return;
  const est = estilo || S.estiloVoz || 'calma';
  textos.filter(Boolean).map(limpiarTxt).forEach((t) => { colaPrecarga = colaPrecarga.then(() => urlVoz(t, est).catch(() => {})); });
}
// Llamar dentro de un toque del usuario: los celulares solo habilitan el sonido así
function desbloquearVoz(estilo = 'calma') {
  S.silencio = false; S.estiloVoz = estilo;
  try { audioVoz.src = SILENCIO; audioVoz.play().catch(() => {}); } catch (e) {}
  if (!HAY_VOZ) return;
  try { if (!vozES) vozES = elegirVoz(); } catch (e) {}
}
function hablarCelular(t, vol, rapido) {
  if (!HAY_VOZ) return avisarFalloVoz();
  try {
    if (!vozES) vozES = elegirVoz();
    const decir = () => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = vozES ? vozES.lang : 'es-ES';
      if (vozES) u.voice = vozES;
      u.rate = rapido ? 1 : 0.82; u.pitch = 0.95; u.volume = vol;
      u.onerror = (e) => {
        if (!e || !e.error || ['interrupted', 'canceled'].includes(e.error)) return;
        // si el celular no puede, pasamos a la voz natural (si está disponible)
        if (S.config.vozNatural && (perfil().motorVoz || 'natural') !== 'natural') { S.usarNaturalPorFallo = true; hablarNatural(t, vol, rapido); }
        else avisarFalloVoz();
      };
      speechSynthesis.speak(u);
      if (speechSynthesis.paused) speechSynthesis.resume();
    };
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(decir, 150); } else decir();
  } catch (e) { avisarFalloVoz(); }
}
function hablarNatural(t, vol, rapido, estilo) {
  const mi = ++turnoVoz;
  try { audioVoz.pause(); } catch (e) {}
  urlVoz(t, estilo || S.estiloVoz || 'calma').then((url) => {
    if (mi !== turnoVoz) return;
    audioVoz.src = url; audioVoz.volume = Math.max(0, Math.min(1, vol));
    return audioVoz.play();
  }).catch(() => {
    if (mi !== turnoVoz) return;
    // sin internet o sin servidor de voz: probamos con la voz del celular
    S.vozFallo = true; hablarCelular(t, vol, rapido);
  });
}
function hablar(txt, { forzar = false, vol = 1, rapido = false, estilo } = {}) {
  if (!forzar && !vozActiva()) return;
  const t = limpiarTxt(txt); if (!t) return;
  if (usarNatural() || S.usarNaturalPorFallo) hablarNatural(t, vol, rapido, estilo);
  else hablarCelular(t, vol, rapido);
}
function callar() {
  turnoVoz++;
  try { audioVoz.pause(); } catch (e) {}
  try { HAY_VOZ && speechSynthesis.cancel(); } catch (e) {}
}
// Botón 🔊/🔇 para las pantallas guiadas (solo para esta sesión)
function botonVoz(fs) {
  if ((!HAY_VOZ && !S.config.vozNatural) || vozApagada()) return;
  const b = document.createElement('button');
  b.className = 'cerrar'; b.style.left = '14px'; b.style.right = 'auto';
  const pintar = () => (b.textContent = vozActiva() ? '🔊' : '🔇');
  b.onclick = (e) => { e.stopPropagation(); S.silencio = !S.silencio; if (S.silencio) callar(); pintar(); };
  pintar(); fs.appendChild(b);
}

function campana(frec = 528, vol = 0.25) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = frec;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 2.6);
  } catch (e) {}
}

// Mantener pantalla encendida durante rutinas
let wakeLock = null;
async function pantallaEncendida(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

// ---------- API ----------
const S = {
  token: localStorage.getItem('vpa_token'),
  usuario: null,
  vista: 'hoy',
  sub: {},            // sub-pestañas por vista
  dias: {},           // cache fecha -> datos
  familia: null, miembros: [],
  config: {},
  cache: {},          // tipo -> registros
};

async function api(metodo, url, cuerpo) {
  const r = await fetch(url, {
    method: metodo,
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && S.token) { salir(); throw new Error('Sesión vencida'); }
  if (r.status === 403 && data && data.suspendida) { salir(); toast(data.error); throw new Error(data.error); }
  if (!r.ok) throw new Error((data && data.error) || 'Error de conexión');
  return data;
}
const perfil = () => (S.usuario && S.usuario.perfil) || {};
async function guardarPerfil(cambios) {
  S.usuario = await api('PATCH', '/api/perfil', cambios);
}
async function registros(tipo, forzar) {
  if (!forzar && S.cache[tipo]) return S.cache[tipo];
  S.cache[tipo] = await api('GET', '/api/registros?tipo=' + tipo);
  return S.cache[tipo];
}
async function nuevoRegistro(tipo, fecha, datos) {
  const r = await api('POST', '/api/registros', { tipo, fecha, datos });
  delete S.cache[tipo];
  return r;
}
async function editarRegistro(id, tipo, fecha, datos) {
  await api('PUT', '/api/registros/' + id, { fecha, datos });
  delete S.cache[tipo];
}
async function borrarRegistro(id, tipo) {
  await api('DELETE', '/api/registros/' + id);
  delete S.cache[tipo];
}
async function cargarDias(desde, hasta) {
  const filas = await api('GET', `/api/dias?desde=${desde}&hasta=${hasta}`);
  filas.forEach((f) => (S.dias[f.fecha] = f.datos));
}
async function marcarDia(fecha, cambios) {
  const r = await api('PUT', '/api/dias/' + fecha, cambios);
  S.dias[fecha] = r.datos;
  return r.datos;
}
async function marcarHabito(clave, valor = true, fecha = hoyStr()) {
  if (!S.dias[fecha]) await cargarDias(fecha, fecha);
  const d = S.dias[fecha] || {};
  const h = { ...(d.h || {}), [clave]: valor };
  await marcarDia(fecha, { h });
}

function flechaInbody(def, actual, antes) {
  if (actual == null || antes == null || actual === antes) return actual === antes && actual != null ? '=' : '';
  const sube = actual > antes;
  const color = !def.mejor ? 'var(--gris)' : (def.mejor === 'sube') === sube ? 'var(--verde)' : 'var(--rojo)';
  return `<span style="color:${color};font-weight:700">${sube ? '↑' : '↓'}</span>`;
}

function pedirConsentimiento() {

    const fs = document.createElement('div');
    fs.className = 'overlay';
    fs.innerHTML = `<div class="modal"><h2>Actualizamos la privacidad y los términos</h2>
      <p>Para seguir usando la app necesitamos que los leas y los aceptes.</p>

      <button class="btn full" data-ok>Acepto</button><button class="btn full borde mt" data-no>Ahora no (cerrar sesión)</button></div>`;
    document.body.appendChild(fs);
    fs.querySelectorAll('[data-l]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); verLegal(a.dataset.l); }));
    $('[data-ok]', fs).onclick = async () => { S.usuario = await api('POST', '/api/aceptar'); fs.remove(); resolve(true); };

}

      const ant = $('[data-ant]', fs); if (ant) ant.onclick = () => { paso--; pintar(); };
      const sig = $('[data-sig]', fs);
      if (sig) sig.onclick = async () => {

          const n = (id) => { const v = $(id, fs).value; return v === '' ? null : Number(String(v).replace(',', '.')); };
          datos.edad = n('#b-edad'); datos.altura = n('#b-altura'); datos.peso = n('#b-peso');
        }
        paso++; pintar();
      };
      fs.querySelectorAll('[data-fin]').forEach((b) => (b.onclick = async () => {

        if (datos.edad) cambios.edad = datos.edad;
        if (datos.altura) cambios.altura = datos.altura;
        try {

      }));
    };
    pintar();
  });
}

function htmlCampo(c, datos) {

function leerCampos(campos, raiz) {
  const out = {};
  campos.forEach((c) => {
    if (c.t === 'titulo' || c.t === 'subtitulo' || c.t === 'nota') return;
    const el = $('#c_' + c.k, raiz);
    if (!el) return;
    if (c.t === 'check') out[c.k] = el.classList.contains('ok');
    else if (c.t === 'escala') out[c.k] = el.dataset.v ? Number(el.dataset.v) : null;
    else if (c.t === 'number') out[c.k] = el.value === '' ? null : Number(String(el.value).replace(',', '.'));
    else out[c.k] = el.value.trim();
  });
  return out;
}

/* ---------- Archivos adjuntos (PDF y fotos) ---------- */
const MAX_PDF = 10 * 1024 * 1024;
function leerBase64(file) {
  return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = mal; r.readAsDataURL(file); });
}
async function comprimirImagen(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, mal) => { img.onload = ok; img.onerror = () => mal(new Error('No se pudo leer la foto')); img.src = url; });
    const k = Math.min(1, 1800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
async function subirArchivo(file, destino) {
  let base64, tipo, nombre = file.name || 'archivo';
  if (file.type === 'application/pdf') {
    if (file.size > MAX_PDF) throw new Error(`"${nombre}" pesa más de 10 MB`);
    base64 = await leerBase64(file); tipo = 'application/pdf';
  } else if (file.type.startsWith('image/')) {
    base64 = await comprimirImagen(file); tipo = 'image/jpeg'; nombre = nombre.replace(/\.[^.]+$/, '') + '.jpg';
  } else throw new Error(`"${nombre}": solo se aceptan PDF o fotos`);
  return api('POST', '/api/archivos', { nombre, tipo, base64, ...destino });
}
async function abrirArchivo(id, nombre) {
  const ventana = window.open('', '_blank');
  try {
    const r = await fetch('/api/archivos/' + id, { headers: { Authorization: 'Bearer ' + S.token } });
    if (!r.ok) throw new Error('No se pudo abrir el archivo');
    const url = URL.createObjectURL(await r.blob());
    if (ventana) ventana.location = url;
    else { const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { if (ventana) ventana.close(); toast(e.message); }
}
const pesoTxt = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
function htmlListaArchivos(lista, pendientes = [], conIA = false) {
  const btnIA = (attr) => (conIA ? `<button class="btn chico" ${attr} title="Completar los campos con IA">✨ Leer</button>` : '');
  const fila = (ic, nombre, extra, acciones) => `<div class="fila entre lista-item" style="padding:8px 0"><div style="min-width:0;flex:1"><span>${ic}</span> <span style="word-break:break-all">${esc(nombre)}</span><br><small class="mut">${extra}</small></div><div class="fila" style="gap:6px">${acciones}</div></div>`;
  return lista.map((a) => fila(a.tipo === 'application/pdf' ? '📄' : '🖼️', a.nombre, pesoTxt(a.tamano),
    `${btnIA(`data-ia-arch="${a.id}"`)}<button class="btn chico sec" data-ver-arch="${a.id}" data-nom="${esc(a.nombre)}">Ver</button><button class="btn chico borde" data-del-arch="${a.id}" title="Quitar">🗑</button>`)).join('') +
    pendientes.map((f, i) => fila('⏳', f.name, 'Se sube al guardar', `${btnIA(`data-ia-pend="${i}"`)}<button class="btn chico borde" data-quitar-pend="${i}">✕</button>`)).join('') ||
    '<p class="mut mb0"><small>Sin archivos todavía.</small></p>';
}
// Caja de adjuntos reutilizable. destino: {registro_id} o {ambito}. Si no hay destino aún, guarda pendientes.
function cajaAdjuntos(raiz, destinoInicial, opciones = {}) {
  const estado = { destino: destinoInicial, lista: [], pendientes: [] };
  const caja = $('[data-adjuntos]', raiz);
  const pintar = () => {
    $('[data-lista-arch]', caja).innerHTML = htmlListaArchivos(estado.lista, estado.pendientes, !!opciones.alLeerIA);
    caja.querySelectorAll('[data-ia-arch]').forEach((b) => (b.onclick = () => leerConIA({ archivo_id: Number(b.dataset.iaArch) }, b, opciones.alLeerIA)));
    caja.querySelectorAll('[data-ia-pend]').forEach((b) => (b.onclick = async () => {
      const f = estado.pendientes[Number(b.dataset.iaPend)];
      try {
        const cuerpo = f.type === 'application/pdf'
          ? { nombre: f.name, tipo: 'application/pdf', base64: await leerBase64(f) }
          : { nombre: f.name, tipo: 'image/jpeg', base64: await comprimirImagen(f) };
        leerConIA(cuerpo, b, opciones.alLeerIA);
      } catch (e) { toast(e.message); }
    }));
    caja.querySelectorAll('[data-ver-arch]').forEach((b) => (b.onclick = () => abrirArchivo(b.dataset.verArch, b.dataset.nom)));
    caja.querySelectorAll('[data-del-arch]').forEach((b) => (b.onclick = async () => {
      if (!confirm('¿Quitar este archivo?')) return;
      await api('DELETE', '/api/archivos/' + b.dataset.delArch); await cargar();
    }));
    caja.querySelectorAll('[data-quitar-pend]').forEach((b) => (b.onclick = () => { estado.pendientes.splice(Number(b.dataset.quitarPend), 1); pintar(); }));
  };
  const cargar = async () => {
    if (estado.destino) {
      const q = estado.destino.registro_id ? 'registro_id=' + estado.destino.registro_id : 'ambito=' + estado.destino.ambito;
      estado.lista = await api('GET', '/api/archivos?' + q);
    }
    pintar();
  };
  const subirTodos = async (files) => {
    for (const f of files) {
      try { toast('Subiendo ' + f.name + '…'); await subirArchivo(f, estado.destino); }
      catch (e) { toast(e.message); }
    }
  };
  $('input[type=file]', caja).onchange = async (e) => {
    const files = [...e.target.files]; e.target.value = '';
    if (!estado.destino) { estado.pendientes.push(...files); pintar(); return; }
    await subirTodos(files); await cargar(); toast('Archivo guardado ✓');
  };
  cargar();
  return {
    // para registros nuevos: al guardar, se sube lo pendiente
    async alGuardar(destino) {
      if (!estado.pendientes.length) return;
      estado.destino = destino; await subirTodos(estado.pendientes); estado.pendientes = [];
    },
  };
}

function llenarConIA(o, r) {
  const marcar = (el) => { el.classList.add('ia-lleno'); };
  const sel = $('#c_tipo', o);
  if (r.tipo === 'inbody') sel.value = 'Composición corporal (InBody)';
  else if (r.tipo === 'analisis') sel.value = 'Análisis de sangre';
  else sel.value = r.estudio || 'Otro';
  marcar(sel);
  sel.onchange && sel.onchange();
  let n = 0;
  const tit = $('#c_titulo', o); if (r.titulo && tit && !tit.value) { tit.value = r.titulo; marcar(tit); }
  Object.entries(r.valores || {}).forEach(([k, v]) => { const el = $('#c_' + k, o); if (el) { el.value = v; marcar(el); n++; } });
  if (r.fecha) { const f = $('#c_fecha', o); f.value = r.fecha; marcar(f); }
  const lugar = $('#c_lugar', o); if (r.lugar && lugar && !lugar.value) { lugar.value = r.lugar; marcar(lugar); }
  const res = $('#c_resultado', o);
  if (res && r.resumen) { res.value = r.resumen; marcar(res); res.style.minHeight = '180px'; }
  else if (res && r.notas && !res.value) { res.value = 'Otros valores: ' + r.notas; marcar(res); }
  const ori = $('#c_orina', o); if (r.orina && ori) { ori.value = r.orina; marcar(ori); }
  o._extraIA = { ...(o._extraIA || {}), refs: { ...((o._extraIA || {}).refs || {}), ...(r.refs || {}) }, otros: r.otros && r.otros.length ? r.otros : ((o._extraIA || {}).otros || []) };
  pintarOtros(o);
  n += (r.otros || []).length;
  const aviso = $('[data-aviso-ia]', o);
  const quedan = r.restantes >= 0 ? ` Te quedan ${r.restantes} lecturas este mes.` : '';
  if (aviso) aviso.innerHTML = n
    ? `<div class="nota" style="border-color:var(--verde)">✨ La IA completó <b>${n} valores</b> (resaltados). <b>Revísalos con el informe</b> antes de guardar.${quedan}</div>`
    : r.resumen
      ? `<div class="nota" style="border-color:var(--verde)">✨ La IA completó el tipo, la fecha y <b>los hallazgos del informe</b> (resaltados). Revísalos antes de guardar.${quedan}</div>`
      : `<div class="nota">La IA no encontró datos para completar en este archivo. Puedes cargarlos a mano.</div>`;
  aviso && aviso.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

const HTML_CAJA_ADJUNTOS = `<div data-adjuntos class="card suave mt" style="margin-bottom:0">

// Qué grupo de campos mostrar según el tipo elegido en el formulario
const GRUPO_POR_TIPO = { lab: 'Análisis de sangre', inbody: 'Composición corporal (InBody)' };

// Formulario de registro (crear o editar)
const CON_ADJUNTOS = ['estudio', 'consulta'];
function formRegistro(tipo, titulo, campos, existente, alGuardar) {
  const datos = existente ? { ...existente.datos, fecha: existente.fecha } : { fecha: hoyStr() };
  const todos = [{ k: 'fecha', l: 'Fecha', t: 'date' }, ...campos];
  const conAdj = CON_ADJUNTOS.includes(tipo);
  modal(`
    <div class="fila entre"><h2 class="mb0">${titulo}</h2><button class="btn chico borde" data-x>✕</button></div>
    ${conAdj ? (tipo === 'estudio' && S.config.ia
      ? HTML_CAJA_ADJUNTOS.replace('<h3>📎 Archivos</h3>', '<h3>📎 ¿Tienes el informe?</h3><p class="mb0" style="font-size:.92rem">Adjunta el PDF o una foto y toca <b>✨ Leer</b>: la IA completa los datos por ti.</p>')
      : HTML_CAJA_ADJUNTOS) : ''}
    <div data-aviso-ia></div>
    ${htmlCampos(todos, datos)}
    <div data-otros></div>
    <button class="btn full mt" data-ok>Guardar</button>
    ${existente ? `<button class="btn full mt borde" data-del style="color:var(--rojo)">Borrar</button>` : ''}
  `, (o) => {
    const adj = conAdj ? cajaAdjuntos(o, existente ? { registro_id: existente.id } : null,
      tipo === 'estudio' && S.config.ia ? { alLeerIA: (r) => llenarConIA(o, r) } : {}) : null;
    o._extraIA = existente && existente.datos.otros ? { otros: [...existente.datos.otros] } : {};
    pintarOtros(o);
    const selTipo = $('#c_tipo', o);
    const grupos = () => {
      if (!selTipo) return;
      o.querySelectorAll('[data-grupo]').forEach((d) => (d.style.display = GRUPO_POR_TIPO[d.dataset.grupo] === selTipo.value ? '' : 'none'));
    };
    if (selTipo) { selTipo.onchange = grupos; grupos(); }
    $('[data-x]', o).onclick = () => o.remove();
    $('[data-ok]', o).onclick = async () => {
      const v = leerCampos(todos, o);
      if (selTipo && !v.tipo) { toast('Elige el tipo de estudio'); selTipo.focus(); return; }
      // no guardar valores de grupos ocultos (ej.: campos de InBody en un análisis de sangre)
      if (selTipo) todos.forEach((c) => { if (c.g && GRUPO_POR_TIPO[c.g] !== v.tipo) delete v[c.k]; });
      const fecha = v.fecha || hoyStr(); delete v.fecha;
      // conservar datos que no son campos del formulario (ej.: referencias del laboratorio)
      const extras = Object.fromEntries(Object.entries((existente && existente.datos) || {}).filter(([k]) => !todos.some((c) => c.k === k)));
      Object.assign(v, { ...extras, ...(o._extraIA || {}), ...v });
      const btn = $('[data-ok]', o); btn.disabled = true;
      try {
        if (existente) await editarRegistro(existente.id, tipo, fecha, v);
        else {
          const nuevo = await nuevoRegistro(tipo, fecha, v);
          if (adj) await adj.alGuardar({ registro_id: nuevo.id });
        }
        delete S.cache[tipo];
        o.remove(); toast('Guardado ✓');
        alGuardar && alGuardar(fecha, v);
        render();
      } catch (e) { toast(e.message); btn.disabled = false; }
    };
    if (existente) $('[data-del]', o).onclick = async () => {
      if (!confirm('¿Borrar este registro?')) return;
      await borrarRegistro(existente.id, tipo); o.remove(); render();
    };
  });
}

const HABITOS = [

function puntosDia(d) {
  if (!d) return 0;
  const h = d.h || {};
  let n = Object.values(h).filter(Boolean).length;
  n += Object.values(d.comidas || {}).filter(Boolean).length >= 3 ? 1 : 0;
  n += (d.agua || 0) >= 6 ? 1 : 0;
  return n;
}
function racha() {
  let r = 0, f = hoyStr();
  if (puntosDia(S.dias[f]) < 3) f = sumarDias(f, -1);
  while (puntosDia(S.dias[f]) >= 3) { r++; f = sumarDias(f, -1); }
  return r;
}
function planDeHoy(fecha = hoyStr()) {
  for (const p of [fuente().plan, fuente().planSig]) {
    if (!p || !p.dias || !p.inicio) continue;
    const i = difDias(fecha, p.inicio);
    if (i >= 0 && i <= 6) return p.dias[i];
  }

}

/* ---------- Focos: el plan se adapta a los análisis (reglas fijas, sin IA) ---------- */
const FOCOS = {
  trigliceridos: { n: 'Triglicéridos', ic: '🐟', que: 'Más pescado y legumbres, menos harinas blancas, y nada de azúcar ni alcohol.' },
  colesterol: { n: 'Colesterol', ic: '🫀', que: 'Más fibra (avena, legumbres, verduras) y grasas buenas; menos frituras, fiambres y carne grasa.' },
  glucemia: { n: 'Glucemia', ic: '🩸', que: 'Menos harinas y almidones (pan, arroz, fideos, papa) y fruta entera en vez de licuados.' },
  acido_urico: { n: 'Ácido úrico', ic: '💧', que: 'Menos carne roja y sardinas; más lácteos descremados y agua.' },
  peso: { n: 'Peso', ic: '⚖️', que: 'Preparaciones livianas, menos harinas y más verdura.' },
};
async function calcularFocos() {
  const [est, pes] = await Promise.all([registros('estudio'), registros('peso')]);
  const lab = est.find((r) => r.datos.tipo === 'Análisis de sangre');
  const ib = est.find(ES_INBODY);
  const d = lab ? lab.datos : {};
  const lista = [];
  const n = (v) => (v === null || v === undefined || v === '' ? null : Number(v));
  if (n(d.tg) >= 150) lista.push({ k: 'trigliceridos', motivo: `Triglicéridos ${d.tg} mg/dL (lo deseable es menos de 150)` });
  if (n(d.ldl) >= 130 || n(d.ct) >= 200) lista.push({ k: 'colesterol', motivo: [n(d.ct) >= 200 && `colesterol total ${d.ct}`, n(d.ldl) >= 130 && `LDL ${d.ldl}`].filter(Boolean).join(' y ') + ' mg/dL' });
  if (n(d.glu) >= 100 || n(d.hba1c) >= 5.7) lista.push({ k: 'glucemia', motivo: n(d.glu) >= 100 ? `Glucemia ${d.glu} mg/dL (lo deseable en ayunas es menos de 100)` : `HbA1c ${d.hba1c}%` });
  if (n(d.au) > 7) lista.push({ k: 'acido_urico', motivo: `Ácido úrico ${d.au} mg/dL` });
  // Peso: el registro más reciente entre "Peso" e InBody
  const candidatos = [pes[0] && { f: pes[0].fecha, v: n(pes[0].datos.peso) }, ib && { f: ib.fecha, v: n(ib.datos.ib_peso) }].filter((x) => x && x.v);
  const ultPeso = candidatos.sort((a, b) => b.f.localeCompare(a.f))[0];
  const alt = n(perfil().altura);
  const imc = ultPeso && alt ? ultPeso.v / ((alt / 100) ** 2) : null;
  if (imc >= 25) lista.push({ k: 'peso', motivo: `IMC ${imc.toFixed(1)} (peso ${ultPeso.v} kg)` });
  // guardar las claves (sin valores) para poder compartirlas con la familia si el usuario quiere
  const claves = lista.map((x) => x.k);
  if (JSON.stringify(claves) !== JSON.stringify(perfil().focos || [])) await guardarPerfil({ focos: claves });
  return { lista, lab, fechaLab: lab && lab.fecha };
}
// focos que usa el plan: los míos + los que otros integrantes eligieron compartir
function focosDelPlan() {
  const f = new Set(perfil().focos || []);
  if (S.familia) S.miembros.filter((m) => m.id !== S.usuario.id).forEach((m) => (m.focos || []).forEach((k) => f.add(k)));
  return f;
}
const ALMIDON = ['pan_integral', 'harina_maiz', 'harina_integral', 'pan_rallado', 'fideos_integrales', 'arroz_integral', 'papa', 'galletas_arroz'];
const FIBRA = ['avena', 'lentejas', 'garbanzos', 'porotos'];
function pesoReceta(r, focos) {
  const tiene = (lista) => r.ing.some((i) => lista.includes(i));
  const alm = tiene(ALMIDON), fib = tiene(FIBRA), roja = tiene(['carne', 'cerdo']);
  let w = 1;
  if (focos.has('trigliceridos')) { if (r.tag === 'pescado') w *= 2.5; if (r.tag === 'legumbre') w *= 2; if (alm) w *= 0.5; if (r.id === 'licuado') w *= 0.4; }
  if (focos.has('colesterol')) { if (fib) w *= 2; if (r.tag === 'pescado') w *= 1.5; if (roja) w *= 0.6; }
  if (focos.has('glucemia')) { if (alm) w *= 0.4; if (r.id === 'licuado') w *= 0.3; if (fib) w *= 1.5; }
  if (focos.has('acido_urico')) { if (roja) w *= 0.4; if (r.ing.includes('sardinas')) w *= 0.2; if (tiene(['yogur', 'leche', 'queso'])) w *= 1.3; }
  if (focos.has('peso')) { if (alm) w *= 0.6; }
  if (r.ia) w *= 1.3; // dar lugar a las recetas nuevas
  return w;
}
function azarPesado(lista, pesos) {
  const total = pesos.reduce((a, b) => a + b, 0);
  let x = Math.random() * total;
  for (let i = 0; i < lista.length; i++) { x -= pesos[i]; if (x <= 0) return lista[i]; }
  return lista[lista.length - 1];
}
function chipsExclusion(set, attr) {
  return `<p class="mut mb0">Grupos completos:</p>` +
    Object.entries(GRUPOS).map(([g, ks]) => `<span class="chip ${ks.every((k) => set.has(k)) ? 'no' : ''}" data-${attr}g="${esc(g)}">${esc(g)}</span>`).join('') +

}
function lunesDe(fecha) {
  const d = parseF(fecha); const dif = (d.getDay() + 6) % 7;

function generarPlan(inicio, evitarIds) {
  const ok = recetasPermitidas();
  const focos = focosDelPlan();
  const semanaAnterior = evitarIds || new Set(fuente().historial || []);
  const de = (m) => ok.filter((r) => r.m.includes(m));
  const dias = [];
  const usados = {};
  const elegir = (m, evitar, preferTag) => {
    let c = de(m).filter((r) => !evitar.includes(r.id));
    if (preferTag) { const t = c.filter((r) => r.tag === preferTag); if (t.length) c = t; }
    if (!c.length) c = de(m);
    if (!c.length) return null;
    // menos usadas primero
    const min = Math.min(...c.map((r) => usados[r.id] || 0));
    const menos = c.filter((x) => (usados[x.id] || 0) === min);
    const r = azarPesado(menos, menos.map((x) => pesoReceta(x, focos) * (semanaAnterior.has(x.id) ? 0.05 : 1)));
    usados[r.id] = (usados[r.id] || 0) + 1;
    return r.id;
  };
  for (let i = 0; i < 7; i++) {
    const prev = dias[i - 1] || {};
    const ev = Object.values(prev);
    const dia = {};
    dia.d = elegir('d', ev);
    dia.k = elegir('k', [...ev, dia.d]);
    dia.m = elegir('m', [...ev, dia.d, dia.k]);
    // pescado días 1 y 4; legumbres días 2 y 5
    const tagA = i === 0 || i === 3 ? 'pescado' : i === 1 || i === 4 ? 'legumbre' : null;
    dia.a = elegir('a', ev, tagA);
    // con triglicéridos altos, una cena más con pescado
    dia.c = elegir('c', [...ev, dia.a], focos.has('trigliceridos') && i === 5 ? 'pescado' : null);
    dias.push(dia);
  }
  return { inicio, dias, creado: hoyStr(), focos: [...focos] };
}

// Cronómetro basado en la hora real: si apagas la pantalla o el celular congela la app,
// al volver el tiempo sigue siendo el correcto. La caminata en curso se guarda en el teléfono.
function reloj(estado) {
  // estado: { inicio, pausadoMs, pausaDesde }
  return {
    seg: () => Math.max(0, Math.floor(((estado.pausaDesde || Date.now()) - estado.inicio - (estado.pausadoMs || 0)) / 1000)),
    pausado: () => !!estado.pausaDesde,
    alternar: () => {
      if (estado.pausaDesde) { estado.pausadoMs = (estado.pausadoMs || 0) + (Date.now() - estado.pausaDesde); estado.pausaDesde = null; }
      else estado.pausaDesde = Date.now();
    },
  };
}
const CLAVE_CAMINATA = 'vpa_caminata';
function caminataGuardada() {
  try {
    const c = JSON.parse(localStorage.getItem(CLAVE_CAMINATA) || 'null');
    if (c && Date.now() - c.inicio < 6 * 3600000) return c; // más de 6 h: se descarta
    localStorage.removeItem(CLAVE_CAMINATA);
  } catch (e) {}
  return null;
}

function caminata(nivel, retomada) {
  const meta = CAMINATA_MIN[nivel - 1] * 60;
  const estado = retomada || { nivel, inicio: Date.now(), pausadoMs: 0, pausaDesde: null };
  if (!retomada) { desbloquearVoz('ejercicio'); precargarVoz(['Ahora, paso rápido', 'Ahora, paso normal', '¡Meta cumplida! Puedes seguir o terminar.']); setTimeout(() => hablar(`Empezamos la caminata. ${CAMINATA_TXT[nivel - 1]} Tu meta: ${CAMINATA_MIN[nivel - 1]} minutos.`), 300); }
  const guardar = () => { try { localStorage.setItem(CLAVE_CAMINATA, JSON.stringify(estado)); } catch (e) {} };
  guardar();
  const rj = reloj(estado);
  const intervalos = nivel >= 4 ? [[60, 120], [120, 120], [120, 60]][nivel - 4] : null; // [rápido, normal]
  const fs = document.createElement('div');
  fs.className = 'full-screen';
  document.body.appendChild(fs);
  pantallaEncendida(true);
  const fase = (t) => {
    if (!intervalos) return '';
    const ciclo = intervalos[0] + intervalos[1];
    return (t % ciclo) < intervalos[0] ? '🏃 Rápido' : '🚶 Normal';
  };
  let ultFase = fase(rj.seg()), metaAvisada = rj.seg() >= meta;
  const pintar = () => {
    const t = rj.seg();
    fs.innerHTML = `<button class="cerrar" data-x>✕</button>
      <h2>Caminata · nivel ${nivel}</h2>
      ${intervalos ? `<div style="font-size:1.6rem;font-weight:700;margin-top:8px">${fase(t)}</div>` : `<p>${CAMINATA_TXT[nivel - 1]}</p>`}
      <div class="reloj">${mmss(t)}</div>
      <p style="opacity:.85">${t >= meta ? '🎉 ¡Meta cumplida! Puedes seguir o terminar.' : 'Meta: ' + mmss(meta)}</p>
      <div class="prog" style="width:80%;background:rgba(255,255,255,.25)"><div style="width:${Math.min(100, (t / meta) * 100)}%;background:#fff"></div></div>
      <div class="fila mt" style="gap:10px"><button class="btn sec" data-p>${rj.pausado() ? '▶ Seguir' : '⏸ Pausa'}</button><button class="btn" data-fin>Terminar</button></div>
      <p style="opacity:.7;font-size:.82rem;margin-top:18px;max-width:340px">Puedes apagar la pantalla y guardar el celular: el tiempo se sigue contando. ${intervalos ? 'Con la pantalla apagada no suenan los avisos de cambio de ritmo.' : ''}</p>`;
    $('[data-x]', fs).onclick = () => { if (rj.seg() < 60 || confirm('¿Salir sin guardar la caminata?')) cerrar(); };
    $('[data-p]', fs).onclick = () => { rj.alternar(); guardar(); pintar(); };
    $('[data-fin]', fs).onclick = () => { const t = rj.seg(); cerrar(); finSesion('Caminata', nivel, Math.max(1, Math.round(t / 60)), 'caminata'); };
  };
  const tick = () => {
    if (rj.pausado()) return;
    const t = rj.seg();
    const f = fase(t); if (f !== ultFase) { ultFase = f; vibrar([200, 100, 200]); campana(f.includes('Rápido') ? 660 : 440); hablar(f.includes('Rápido') ? 'Ahora, paso rápido' : 'Ahora, paso normal'); }
    if (!metaAvisada && t >= meta) { metaAvisada = true; vibrar([300, 150, 300]); campana(); hablar('¡Meta cumplida! Puedes seguir o terminar.'); }
    pintar();
  };
  const iv = setInterval(tick, 1000);
  // al volver a la app (pantalla encendida de nuevo), actualizar al instante y volver a pedir pantalla encendida
  const alVolver = () => { if (document.visibilityState === 'visible') { pantallaEncendida(true); tick(); } };
  document.addEventListener('visibilitychange', alVolver);
  function cerrar() {
    clearInterval(iv); document.removeEventListener('visibilitychange', alVolver);
    try { localStorage.removeItem(CLAVE_CAMINATA); } catch (e) {}
    pantallaEncendida(false); fs.remove();
  }
  pintar();
}

function reproducirRutina(clave, nivel) {
  const R = RUTINAS[clave];
  const rondas = R.rondas[nivel - 1];
  const pasos = [];
  const series = R.modo === 'series';
  if (series) {
    R.ej.forEach((e, i) => {
      const n = e.t === 's' ? 1 : rondas;
      for (let k = 1; k <= n; k++) {
        pasos.push({ ...e, val: e.v[nivel - 1], serie: k, series: n });
        const ultimo = i === R.ej.length - 1 && k === n;
        if (!ultimo) pasos.push({ descanso: true, val: k < n ? 75 : 90 });
      }
    });
  } else {
    for (let r = 1; r <= rondas; r++) R.ej.forEach((e, i) => {
      pasos.push({ ...e, val: e.v[nivel - 1], ronda: r });
      const ultimo = r === rondas && i === R.ej.length - 1;
      if (!ultimo && clave !== 'estirar') pasos.push({ descanso: true, val: i === R.ej.length - 1 ? 60 : 30 });
    });
  }
  const anteriores = ultimosPesos();
  const pesos = {};
  desbloquearVoz('ejercicio');
  // ---- Voz guía: anuncia cada paso, cuenta repeticiones y avanza solo (manos libres) ----
  const RITMO = series ? 4 : 3; // segundos por repetición
  const durTxt = (n) => (n >= 60 && n % 60 === 0 ? `${n / 60} ${n === 60 ? 'minuto' : 'minutos'}` : `${n} segundos`);
  const primera = (p) => (series ? p.serie === 1 : p.ronda === 1);
  const kgDe = (p) => pesos[p.id] ?? anteriores[p.id];
  const previa = (p) => (primera(p) ? Math.min(14, 5 + Math.ceil((p.d || '').length / 15)) : 4);
  const anuncio = (p) => {
    if (p.descanso) {
      const sig = pasos.slice(idx + 1).find((x) => !x.descanso);
      return `Descansa ${durTxt(p.val)}.` + (sig ? ` Lo que sigue: ${sig.n}${series && sig.series > 1 ? `, serie ${sig.serie}` : ''}.` : '');
    }
    const kg = p.kg && kgDe(p) != null ? `, con ${String(kgDe(p)).replace('.', ',')} kilos` : '';
    return `${p.n}.${series && p.series > 1 ? ` Serie ${p.serie} de ${p.series}.` : ''} ${p.t === 's' ? durTxt(p.val) : `${p.val} repeticiones${p.lado ? ' por lado' : ''}`}${kg}.${primera(p) ? ' ' + p.d : ''}`;
  };
  const NUM = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco'];
  const numero = (n) => NUM[n] || String(n);
  let idx = 0, t = 0, pausa = false;
  const inicio = Date.now();
  const fs = document.createElement('div');
  fs.className = 'full-screen';
  document.body.appendChild(fs);
  pantallaEncendida(true);
  const pintar = () => {
    const p = pasos[idx];
    const sig = pasos.slice(idx + 1).find((x) => !x.descanso);
    const restante = p.t === 's' || p.descanso ? p.val - t : null;
    fs.className = 'full-screen' + (p.descanso ? ' calmo' : '');
    fs.innerHTML = `<button class="cerrar" data-x>✕</button>
      <small style="opacity:.8">${R.n} · ${p.descanso ? 'Descanso' : series ? (p.series > 1 ? `Serie ${p.serie} de ${p.series}` : 'Una vez') : `Ronda ${p.ronda} de ${rondas}`} · paso ${idx + 1}/${pasos.length}</small>
      <h1 style="margin-top:14px">${p.descanso ? '😮‍💨 Descansa' : esc(p.n)}</h1>
      ${p.descanso ? `<p>Respira tranquilo.${sig ? ' Lo que sigue: <b>' + esc(sig.n) + '</b>' : ''}</p>` : `<p class="paso-txt">${esc(p.d)}</p>`}
      <div class="reloj" id="cuenta-rep">${restante !== null ? mmss(restante) : p.val + (p.lado ? ' x lado' : ' rep.')}</div>
      ${restante === null && !p.descanso && vozActiva() ? '<p style="opacity:.75;font-size:.85rem;margin-top:-6px">🔊 Te cuento las repeticiones y paso solo al siguiente.</p>' : ''}
      ${!p.descanso && p.kg ? `<div style="margin:0 0 14px"><label style="opacity:.85;display:block;margin-bottom:4px">Peso (kg)${anteriores[p.id] != null ? ` · la vez pasada: ${anteriores[p.id]} kg` : ''}</label>
        <input class="i" id="kg" type="number" inputmode="decimal" step="0.5" value="${pesos[p.id] ?? anteriores[p.id] ?? ''}" style="max-width:130px;text-align:center;font-size:1.4rem;font-weight:700"></div>` : ''}
      <div class="fila" style="gap:10px">
        <button class="btn sec" data-p>${pausa ? '▶' : '⏸'}</button>
        <button class="btn" data-ok>${restante !== null ? 'Saltar ⏭' : 'Listo ✓'}</button>
      </div>`;
    $('[data-x]', fs).onclick = () => { if (confirm('¿Salir de la rutina?')) cerrar(); };
    $('[data-p]', fs).onclick = () => { pausa = !pausa; if (pausa) { callar(); hablar('Pausa', { rapido: true }); } else hablar('Seguimos', { rapido: true }); pintar(); };
    $('[data-ok]', fs).onclick = siguiente;
    botonVoz(fs);
  };
  const siguiente = () => {
    const kg = $('#kg', fs);
    if (kg && kg.value !== '') pesos[pasos[idx].id] = Number(String(kg.value).replace(',', '.'));
    idx++; t = 0;
    if (idx >= pasos.length) {
      cerrar(); campana(660); hablar('¡Terminaste! Muy bien hecho.');
      finSesion(R.n, nivel, Math.max(1, Math.round((Date.now() - inicio) / 60000)), 'fuerza', false, Object.keys(pesos).length ? { pesos } : {});
      return;
    }
    vibrar(); pintar(); hablar(anuncio(pasos[idx]));
  };
  const iv = setInterval(() => {
    if (pausa) return;
    const p = pasos[idx];
    if (p.t === 's' || p.descanso) {
      t++;
      const quedan = p.val - t;
      if (quedan === 3) vibrar(80);
      if (vozActiva()) {
        if (quedan === 10 && p.val >= 30) hablar('Diez segundos', { rapido: true });
        else if (quedan > 0 && quedan <= 3) hablar(numero(quedan), { rapido: true });
      }
      if (t >= p.val) { campana(p.descanso ? 660 : 528); siguiente(); return; }
      const r = $('.reloj', fs); if (r) r.textContent = mmss(quedan);
    } else if (vozActiva()) {
      // repeticiones: cuenta en voz alta y avanza sola
      t++;
      const ini = previa(p), total = p.lado ? p.val * 2 : p.val;
      if (t < ini || (t - ini) % RITMO !== 0) return;
      const k = (t - ini) / RITMO + 1;
      const r = $('#cuenta-rep', fs);
      if (k <= total) {
        const enLado = p.lado && k > p.val ? k - p.val : k;
        hablar((p.lado && k === p.val + 1 ? 'Cambia de lado. ' : '') + numero(enLado), { rapido: true });
        if (r) r.textContent = `${enLado} / ${p.val}`;
      } else { hablar('Listo', { rapido: true }); siguiente(); }
    }
  }, 1000);
  function cerrar() { clearInterval(iv); callar(); pantallaEncendida(false); fs.remove(); }
  precargarVoz([anuncio(pasos[0]), ...NUM.slice(1, 26), 'Listo', 'Pausa', 'Seguimos', 'Diez segundos', '¡Terminaste! Muy bien hecho.',
    ...pasos.slice(1).map((p) => { const k = idx; idx = pasos.indexOf(p); const a = anuncio(p); idx = k; return a; }),
    ...NUM.slice(1, 13).map((n) => 'Cambia de lado. ' + n)]);
  pintar(); setTimeout(() => hablar(anuncio(pasos[0])), 300);
}

function respiracion(minutos, oscuro) {
  const total = minutos * 60;
  let t = 0, fase = 'in', ft = 0;
  const fs = document.createElement('div');
  fs.className = 'full-screen calmo';
  if (oscuro) fs.style.background = '#0d1716';
  desbloquearVoz();
  precargarVoz(oscuro ? ['Cierra los ojos. Respira conmigo.', 'Inhala', 'Exhala lento', 'Que descanses.']
    : ['Cierra los ojos. Vamos a respirar juntos.', 'Inhala', 'Exhala lento', 'Exhala lento. Ahora sigue los sonidos: agudo, inhalas. Grave, exhalas.', 'Muy bien. Cuando quieras, abre los ojos.']);
  // De noche: voz bajita en todas las respiraciones (sin pasar a tonos) y final en silencio
  const volVoz = oscuro ? 0.45 : 1;
  fs.innerHTML = `<button class="cerrar" data-x>✕</button>
    <div class="circulo" id="circ">Inhala</div>
    <div id="cuenta" style="font-size:1.4rem;opacity:.9">4</div>
    <p style="opacity:.75" id="rest">${mmss(total)}</p>`;
  document.body.appendChild(fs);
  pantallaEncendida(true);
  const circ = $('#circ', fs);
  botonVoz(fs);
  let ciclos = 0;
  // Para hacerlo con los ojos cerrados: la voz guía las primeras respiraciones y después un tono suave marca cada cambio
  const aplicar = () => {
    circ.style.transitionDuration = fase === 'in' ? '4s' : '6s';
    circ.style.transform = fase === 'in' ? 'scale(1.25)' : 'scale(0.8)';
    circ.textContent = fase === 'in' ? 'Inhala' : 'Exhala';
    if (fase === 'in') ciclos++;
    if (vozActiva() && (oscuro || ciclos <= 3)) hablar(fase === 'in' ? 'Inhala' : (!oscuro && ciclos === 3) ? 'Exhala lento. Ahora sigue los sonidos: agudo, inhalas. Grave, exhalas.' : 'Exhala lento', { vol: volVoz });
    else campana(fase === 'in' ? 528 : 396, oscuro ? 0.05 : 0.22);
  };
  // con voz, primero una indicación corta y después arranca la respiración
  const espera = vozActiva() ? 3 : 0;
  if (espera) { circ.textContent = 'Cierra los ojos'; hablar(oscuro ? 'Cierra los ojos. Respira conmigo.' : 'Cierra los ojos. Vamos a respirar juntos.', { vol: volVoz }); }
  setTimeout(() => requestAnimationFrame(() => { circ.style.transform = 'scale(0.8)'; requestAnimationFrame(aplicar); }), espera * 1000);
  let previa = espera;
  const iv = setInterval(async () => {
    if (previa > 0) { previa--; return; }
    t++; ft++;
    const dur = fase === 'in' ? 4 : 6;
    if (ft >= dur) { fase = fase === 'in' ? 'out' : 'in'; ft = 0; aplicar(); }
    $('#cuenta', fs).textContent = (fase === 'in' ? 4 : 6) - ft;
    $('#rest', fs).textContent = mmss(total - t);
    if (t >= total) {
      cerrar();
      if (oscuro) hablar('Que descanses.', { vol: 0.3 }); // de noche no hay campana ni "abre los ojos"
      else { campana(); hablar('Muy bien. Cuando quieras, abre los ojos.'); }
      await registrarCalma('Respiración 4-6', minutos);
    }
  }, 1000);
  function cerrar() { clearInterval(iv); callar(); pantallaEncendida(false); fs.remove(); }
  $('[data-x]', fs).onclick = async () => { cerrar(); if (t >= 60) await registrarCalma('Respiración 4-6', Math.round(t / 60)); };
}

function meditar(minutos, guiada) {
  const total = minutos * 60;
  const rj = reloj({ inicio: Date.now(), pausadoMs: 0, pausaDesde: null });
  let t = 0, pausa = false;
  const cada = Math.max(25, Math.floor(total / GUIA_MEDITACION.length));
  const fs = document.createElement('div');
  fs.className = 'full-screen calmo';
  document.body.appendChild(fs);
  pantallaEncendida(true); campana(432); desbloquearVoz();
  if (guiada) precargarVoz([...GUIA_MEDITACION, 'Muy bien. Mueve suavemente las manos y, cuando quieras, abre los ojos.']);
  let ultimaDicha = -1;
  const pintar = () => {
    const i = Math.min(GUIA_MEDITACION.length - 1, Math.floor(t / cada));
    const frase = guiada ? GUIA_MEDITACION[i] : '';
    // la voz lee cada frase una sola vez: puedes tener los ojos cerrados
    if (guiada && i !== ultimaDicha && !pausa) { ultimaDicha = i; setTimeout(() => hablar(frase), t === 0 ? 1800 : 0); }
    fs.innerHTML = `<button class="cerrar" data-x>✕</button>
      ${guiada ? `<p class="paso-txt" style="min-height:5em">${esc(frase)}</p>${vozActiva() ? '<p style="opacity:.7;font-size:.85rem">🔊 Cierra los ojos: te guío con la voz.</p>' : ''}` : '<p style="opacity:.8">Silencio</p>'}
      <div class="reloj">${mmss(total - t)}</div>
      <button class="btn sec" data-p>${pausa ? '▶ Seguir' : '⏸ Pausa'}</button>`;
    $('[data-x]', fs).onclick = async () => { cerrar(); if (t >= 60) await registrarCalma(guiada ? 'Meditación guiada' : 'Silencio', Math.round(t / 60)); };
    $('[data-p]', fs).onclick = () => { pausa = !pausa; rj.alternar(); if (pausa) callar(); pintar(); };
    if (guiada) botonVoz(fs);
  };
  // el tiempo sale de la hora real: si la pantalla se apaga, al volver sigue donde corresponde
  let terminado = false;
  const tick = async () => {
    if (pausa || terminado) return;
    t = Math.min(total, rj.seg());
    if (t >= total) { terminado = true; cerrar(); campana(432); if (guiada) hablar('Muy bien. Mueve suavemente las manos y, cuando quieras, abre los ojos.'); await registrarCalma(guiada ? 'Meditación guiada' : 'Silencio', minutos); return; }
    const i = Math.min(GUIA_MEDITACION.length - 1, Math.floor(t / cada));
    if (guiada && i !== ultimaDicha) pintar(); else { const r = $('.reloj', fs); if (r) r.textContent = mmss(total - t); }
  };
  const iv = setInterval(tick, 1000);
  const alVolver = () => { if (document.visibilityState === 'visible') { pantallaEncendida(true); tick(); } };
  document.addEventListener('visibilitychange', alVolver);
  function cerrar() { clearInterval(iv); document.removeEventListener('visibilitychange', alVolver); callar(); pantallaEncendida(false); fs.remove(); }
  pintar();
}

function oracionGuiada(momento) {
  desbloquearVoz();
  const ors = perfil().oraciones || [];
  const pasos = [
    { t: 'Silencio', txt: momento === 'mañana' ? 'Antes de empezar el día, respira tres veces profundo. Este momento es para ti y para Dios.' : 'Termina el día. Respira tres veces profundo y deja que el cuerpo afloje.', seg: 30 },
    { t: 'Agradecer', txt: momento === 'mañana' ? '¿Por qué tres cosas puedes dar gracias hoy?' : '¿Qué tres cosas buenas pasaron hoy, aunque sean chiquitas?', campo: 'gratitud' },
    { t: 'Entregar', txt: 'Lo que te preocupa (la salud, el dinero, el trabajo) no tienes que cargarlo solo. Escríbelo y entrégalo.', campo: 'entrego' },
    { t: 'Pedir', txt: '¿Qué pides hoy para ti y para los tuyos?', campo: 'pido' },
    ...(ors.length ? [{ t: 'Mis oraciones', txt: '', oraciones: true }] : []),
    { t: momento === 'mañana' ? 'Para el día' : 'Para descansar', txt: momento === 'mañana' ? 'Elige una intención simple para hoy: paciencia, presencia, calma…' : 'Suelta el día. Lo que no se resolvió hoy puede esperar a mañana. Estás cuidado.', campo: momento === 'mañana' ? 'intencion' : null },
  ];
  const datos = { momento };
  precargarVoz(pasos.map((p) => p.t + '. ' + (p.txt || '') + (p.oraciones ? ' ' + ors.map((o) => o.titulo + '. ' + o.texto).join('. ') : '')));
  let i = 0;
  const fs = document.createElement('div');
  fs.className = 'full-screen calmo';
  if (momento === 'noche') fs.style.background = 'linear-gradient(180deg,#1d2b45,#2c3e5c)';
  document.body.appendChild(fs);
  const pintar = () => {
    const p = pasos[i];
    fs.innerHTML = `<button class="cerrar" data-x>✕</button>
      <small style="opacity:.75">${i + 1} de ${pasos.length}</small>
      <h1 style="margin-top:10px">${p.t}</h1>
      ${p.txt ? `<p class="paso-txt">${p.txt}</p>` : ''}
      ${p.oraciones ? `<div style="text-align:left;max-width:480px;width:100%">${ors.map((o) => `<div style="background:rgba(255,255,255,.12);border-radius:14px;padding:12px;margin:8px 0"><b>${esc(o.titulo)}</b><p style="white-space:pre-wrap;margin:.4em 0 0">${esc(o.texto)}</p></div>`).join('')}</div>` : ''}
      ${p.campo ? `<textarea class="i" id="campo" style="max-width:480px;min-height:110px;margin-top:8px" placeholder="Escribe aquí (opcional)">${esc(datos[p.campo] || '')}</textarea>` : ''}
      ${p.seg ? `<div class="reloj" id="seg">${p.seg}</div>` : ''}
      <div class="fila mt" style="gap:10px">${i > 0 ? '<button class="btn sec" data-ant>←</button>' : ''}<button class="btn" data-sig>${i === pasos.length - 1 ? 'Amén 🙏' : 'Siguiente →'}</button></div>`;
    $('[data-x]', fs).onclick = cerrar;
    const guardarCampo = () => { const c = $('#campo', fs); if (c && p.campo) datos[p.campo] = c.value.trim(); };
    const ant = $('[data-ant]', fs); if (ant) ant.onclick = () => { guardarCampo(); i--; pintar(); };
    $('[data-sig]', fs).onclick = async () => {
      guardarCampo();
      if (i < pasos.length - 1) { i++; pintar(); return; }
      cerrar();
      await nuevoRegistro('oracion', hoyStr(), datos);
      await marcarHabito(momento === 'mañana' ? 'oracion_m' : 'oracion_n');
      toast('Que tengas ' + (momento === 'mañana' ? 'un buen día ☀️' : 'buenas noches 🌙'));
      render();
    };
    if (p.seg) {
      let s = p.seg;
      const iv = setInterval(() => { s--; const el = $('#seg', fs); if (!el) return clearInterval(iv); el.textContent = s; if (s <= 0) { clearInterval(iv); el.textContent = '✓'; campana(432); } }, 1000);
    }
    botonVoz(fs);
    // la voz lee el paso (y tus oraciones) para que puedas rezar con los ojos cerrados
    hablar(p.t + '. ' + (p.txt || '') + (p.oraciones ? ' ' + ors.map((o) => o.titulo + '. ' + o.texto).join('. ') : ''));
  };
  function cerrar() { callar(); fs.remove(); }
  pintar();
}

function rescate() {
  desbloquearVoz();
  const p = perfil();

function horasSueno(d) {
  if (!d.acoste || !d.levante) return null;
  const [a1, a2] = d.acoste.split(':').map(Number), [l1, l2] = d.levante.split(':').map(Number);
  let m = (l1 * 60 + l2) - (a1 * 60 + a2); if (m <= 0) m += 1440;
  return Math.max(0, (m - (d.tardo || 0)) / 60);
}
function estadoLab(def, v) {
  if (v === null || v === undefined || v === '' || !def.ok) return '';
  if (def.ok(v)) return '<span class="badge">OK</span>';
  if (def.medio && def.medio(v)) return '<span class="badge medio">Revisar</span>';
  return '<span class="badge alto">Fuera de rango</span>';
}
function sparkline(vals, w = 300, h = 60) {
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * (w - 10) + 5},${h - 5 - ((v - min) / r) * (h - 10)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px"><polyline points="${pts}" fill="none" stroke="#1f6f5c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v, i) => `<circle cx="${(i / (vals.length - 1)) * (w - 10) + 5}" cy="${h - 5 - ((v - min) / r) * (h - 10)}" r="3.5" fill="#1f6f5c"/>`).join('')}</svg>`;
}

      const ib = regs.filter(ES_INBODY);
      if (ib.length) {
        const [a, b] = ib;
        const serie = (k) => ib.filter((r) => r.datos[k] != null).slice(0, 12).reverse().map((r) => Number(r.datos[k]));
        const gr = serie('ib_grasa_pct'), mu = serie('ib_musculo');
        extra += `<div class="card"><h3>⚖️ Composición corporal (InBody)</h3><table class="val"><tr><th>Valor</th>${b ? `<th>${fechaCorta(b.fecha)}</th>` : ''}<th>${fechaCorta(a.fecha)}</th></tr>
          ${INBODY.filter((v) => a.datos[v.k] != null || (b && b.datos[v.k] != null)).map((v) => `<tr><td>${v.n}</td>${b ? `<td>${b.datos[v.k] ?? '—'}</td>` : ''}<td><b>${a.datos[v.k] ?? '—'}</b> ${b ? flechaInbody(v, a.datos[v.k], b.datos[v.k]) : ''}</td></tr>`).join('')}</table>
          ${b ? '<p class="mut mb0 mt"><small>Verde: va en buena dirección (más músculo, menos grasa). Rojo: al revés.</small></p>' : ''}
          ${gr.length >= 2 ? `<p class="mt mb0"><small>% de grasa</small></p>${sparkline(gr)}` : ''}${mu.length >= 2 ? `<p class="mb0"><small>Masa muscular</small></p>${sparkline(mu)}` : ''}</div>`;
      }
      const lab = regs.filter((r) => r.datos.tipo === 'Análisis de sangre');
      if (lab.length >= 2) {
        const [a, b] = lab;
        extra += `<div class="card"><h3>Comparación de análisis</h3><table class="val"><tr><th>Valor</th><th>${fechaCorta(b.fecha)}</th><th>${fechaCorta(a.fecha)}</th><th></th></tr>
          ${LAB.filter((v) => a.datos[v.k] != null || b.datos[v.k] != null).map((v) => {
            const va = a.datos[v.k], vb = b.datos[v.k];
            const fl = va != null && vb != null ? (va < vb ? '↓' : va > vb ? '↑' : '=') : '';
            return `<tr><td>${v.n}${(a.datos.refs || {})[v.k] ? `<br><small class="mut">ref. ${esc(a.datos.refs[v.k])}</small>` : ''}</td><td>${vb ?? '—'}</td><td><b>${va ?? '—'}</b> ${fl}</td><td>${estadoLab(v, va)}</td></tr>`;
          }).join('')}</table></div>`;
      }
    }
    if (sub === 'sueno' && regs.length) {
      const ult = regs.slice(0, 14);
      const hs = ult.map((r) => horasSueno(r.datos)).filter((x) => x !== null);
      extra = `<div class="card suave"><small>Últimas ${ult.length} noches</small><div class="fila entre mt">
        <div><b>${hs.length ? (hs.reduce((a, b) => a + b, 0) / hs.length).toFixed(1) : '—'} h</b><br><small>promedio</small></div>
        <div><b>${(ult.reduce((a, r) => a + (r.datos.despertares || 0), 0) / ult.length).toFixed(1)}</b><br><small>despertares</small></div>

    }
    cuerpo = `<button class="btn full" id="nuevo" style="margin-bottom:12px">+ ${sub === 'sueno' ? 'Registrar la noche' : 'Agregar'}</button>${extra}
      <div class="card">${regs.map((r) => `<div class="lista-item" data-ed="${r.id}" style="cursor:pointer"><small class="mut">${fechaCorta(r.fecha)}</small><br>${linea(r)}</div>`).join('') || '<p class="mut">Todavía no hay registros.</p>'}</div>`;
    setTimeout(() => {
      $('#nuevo').onclick = () => formRegistro(sub, TITULOS[sub], CAMPOS[sub]);
      document.querySelectorAll('[data-ed]').forEach((el) => (el.onclick = () => formRegistro(sub, TITULOS[sub], CAMPOS[sub], regs.find((r) => r.id == el.dataset.ed))));
    });
  }

  $('#app').innerHTML = `${encabezado('Mi salud', 'Todo en un lugar para tus médicos')}
    <div class="tabs">${tabs.map(([k, t]) => `<span class="chip ${sub === k ? 'on' : ''}" data-sub="${k}">${t}</span>`).join('')}</div>${cuerpo}`;
  document.querySelectorAll('[data-sub]').forEach((el) => (el.onclick = () => { S.sub.salud = el.dataset.sub; render(); }));
}

const PLANES = { gratis: 'Gratis', pro: 'Pro', cortesia: 'Cortesía' };
function haceCuanto(iso) {
  if (!iso) return 'nunca';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 60) return 'hace un rato';
  const h = Math.round(min / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); if (d < 30) return `hace ${d} ${d === 1 ? 'día' : 'días'}`;
  const m = Math.round(d / 30); return `hace ${m} ${m === 1 ? 'mes' : 'meses'}`;
}
const fechaIso = (iso) => (iso ? fechaCorta(String(iso).slice(0, 10)) : '—');

    $('[data-borrar]', o).onclick = () => modal(`<h2>Borrar la cuenta de ${esc(u.nombre)}</h2>
      <p>Se borran <b>para siempre</b> la cuenta y todo lo que cargó. No se puede deshacer.</p>
      <label class="f">Para confirmar, escribe su email: <b>${esc(u.email)}</b></label><input class="i" id="del-conf" autocomplete="off">
      <button class="btn full rojo mt" data-ok>Borrar definitivamente</button><button class="btn full borde mt" data-x>Cancelar</button>`, (o2) => {
      $('[data-x]', o2).onclick = () => o2.remove();
      $('[data-ok]', o2).onclick = async () => {
        const r = await accion(() => api('DELETE', '/api/admin/usuarios/' + u.id, { confirmar: $('#del-conf', o2).value }), 'Cuenta borrada');
        if (r) { o2.remove(); o.remove(); vistaAdmin(); }
      };
    });
  });
}

/* =========================================================
   INICIO
   ========================================================= */
async function iniciar() {
  try { S.config = await api('GET', '/api/config'); } catch (e) { S.config = {}; }
  const m = location.hash.match(/^#reset=([a-f0-9]{64})$/);
  if (m) { S.resetToken = m[1]; return vistaLogin('reset'); }
  if (!S.token) return vistaLogin();
  try {
    if (!S.usuario) S.usuario = await api('GET', '/api/yo');
  } catch (e) { return; }
  if (!S.usuario.acepto && !(await pedirConsentimiento())) return;
  let destino = 'hoy';
  if (!perfil().bienvenida) destino = await bienvenida();
  if (location.pathname === '/admin' && S.usuario.admin) destino = 'admin';
  $('#nav').classList.remove('oculto');
  ir(destino);
  // si había una caminata en curso (por ejemplo, el celular cerró la app), seguirla
  const cg = caminataGuardada();
  if (cg) { caminata(cg.nivel || 1, cg); toast('Seguimos con tu caminata 🚶'); }
}
window.addEventListener('hashchange', () => { if (/^#reset=/.test(location.hash)) { S.usuario = null; iniciar(); } });
iniciar();
</script>
